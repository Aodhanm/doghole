  ctx.fillRect(T.X(w.x+w.len*.55), T.Y(w.y-9), T.S(34), T.S(13));
  ctx.fillStyle="#67727b";
  ctx.fillRect(T.X(w.x+w.len*.55), T.Y(w.y-9), T.S(34), T.S(6.5));
  ctx.fillStyle="rgba(255,214,150,.7)";
  ctx.fillRect(T.X(w.x+w.len*.6), T.Y(w.y-5), T.S(5), T.S(3));
  // two lamps on the head, burning through it
  for (const dy of [-w.wide/2, w.wide/2]){
    const gg=ctx.createRadialGradient(T.X(w.x),T.Y(w.y+dy),0,T.X(w.x),T.Y(w.y+dy),Math.max(10,T.S(40)));
    gg.addColorStop(0,"rgba(255,214,150,.65)"); gg.addColorStop(1,"rgba(255,214,150,0)");
    ctx.fillStyle=gg; const rr=Math.max(10,T.S(40));
    ctx.fillRect(T.X(w.x)-rr, T.Y(w.y+dy)-rr, rr*2, rr*2);
  }
  if (phase==="city" || phase==="berth" || phase==="bay"){
    const pulse=.4+.3*Math.sin(t*2.2);
    ctx.setLineDash([T.S(5),T.S(5)]);
    ctx.strokeStyle=`rgba(242,166,60,${pulse})`;
    ctx.lineWidth=Math.max(1.4,T.S(1.2));
    ctx.beginPath();
    ctx.arc(T.X(G.BERTH.x), T.Y(G.BERTH.y), T.S(G.BERTH.tol), 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
    if (T.k > .3){
      ctx.globalAlpha=.8; ctx.fillStyle="#f2a63c";
      ctx.font=`${Math.max(10,Math.min(14,T.S(9)))}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign="center";
      ctx.fillText("the lumber wharf", T.X(G.BERTH.x), T.Y(G.BERTH.y)-T.S(G.BERTH.tol+8));
      ctx.globalAlpha=1;
    }
  }
  ctx.restore();
}

// Fort Point: a Third System casemated work. From above it is a SQUARE with
// an open PARADE GROUND in the middle, casemate tiers on three faces looking
// out over the water, the gorge wall and its entrance on the landward side,
// and a stair tower at one corner. Not a filled rectangle.
function drawFortPoint(){
  const f = G.FORT_POINT, R = 52, WALL = 12;
  ctx.save(); ctx.translate(T.X(f.x), T.Y(f.y)); ctx.rotate(.34);
  // the counterscarp shadow
  ctx.fillStyle="rgba(4,6,10,.6)";
  ctx.fillRect(T.S(-R)+T.S(3), T.S(-R)+T.S(3), T.S(R*2), T.S(R*2));
  // the mass of the work
  ctx.fillStyle="#6b5a49";
  ctx.fillRect(T.S(-R), T.S(-R), T.S(R*2), T.S(R*2));
  ctx.strokeStyle="rgba(232,216,196,.55)"; ctx.lineWidth=Math.max(1,T.S(1));
  ctx.strokeRect(T.S(-R), T.S(-R), T.S(R*2), T.S(R*2));
  // the parade ground, open to the sky
  ctx.fillStyle="#3b4436";
  ctx.fillRect(T.S(-R+WALL), T.S(-R+WALL), T.S((R-WALL)*2), T.S((R-WALL)*2));
  ctx.strokeStyle="rgba(20,24,20,.7)";
  ctx.strokeRect(T.S(-R+WALL), T.S(-R+WALL), T.S((R-WALL)*2), T.S((R-WALL)*2));
  // casemates: embrasures along the three seaward faces
  ctx.fillStyle="#2c241c";
  const n = 9;
  for (let i=0;i<n;i++){
    const t2 = -R + WALL*.5 + (i+.5)*(R*2 - WALL)/n;
    ctx.fillRect(T.S(t2-3), T.S(-R+1.5), T.S(6), T.S(4));        // north face
    ctx.fillRect(T.S(-R+1.5), T.S(t2-3), T.S(4), T.S(6));        // west face
    ctx.fillRect(T.S(R-5.5), T.S(t2-3), T.S(4), T.S(6));         // east face
  }
  // the gorge: the landward wall, with the sally port in the middle of it
  ctx.fillStyle="#5d4e40";
  ctx.fillRect(T.S(-R), T.S(R-WALL), T.S(R*2), T.S(WALL));
  ctx.fillStyle="#241c14";
  ctx.fillRect(T.S(-7), T.S(R-WALL), T.S(14), T.S(WALL));
  // the stair tower at the north-west angle, and the light on the wall
  ctx.fillStyle="#7a6753";
  ctx.fillRect(T.S(-R-5), T.S(-R-5), T.S(16), T.S(16));
  ctx.fillStyle="rgba(255,232,184,.95)";
  ctx.beginPath(); ctx.arc(T.S(R-6), T.S(-R+6), Math.max(2,T.S(3.4)), 0, Math.PI*2); ctx.fill();
  ctx.restore();
  if (T.k > .2){
    ctx.globalAlpha=.8; ctx.fillStyle="#e2d8c8";
    ctx.font=`${Math.max(10,Math.min(15,T.S(9)))}px ${getComputedStyle(document.body).fontFamily}`;
    ctx.textAlign="center";
    ctx.fillText("Fort Point", T.X(f.x), T.Y(f.y)-T.S(66)); ctx.globalAlpha=1;
  }
}

function block(x, y, w, h, rot, lit){
  ctx.save(); ctx.translate(T.X(x), T.Y(y)); ctx.rotate(rot||0);
  ctx.fillStyle="rgba(5,8,12,.6)";
  ctx.fillRect(T.S(-w/2)+T.S(1.5), T.S(-h/2)+T.S(1.8), T.S(w), T.S(h));
  ctx.fillStyle="#3f4a53";
  ctx.fillRect(T.S(-w/2), T.S(-h/2), T.S(w), T.S(h));
  ctx.fillStyle="#4c5a64";
  ctx.fillRect(T.S(-w/2), T.S(-h/2), T.S(w), T.S(h/2));
  ctx.strokeStyle="rgba(180,196,210,.45)"; ctx.lineWidth=Math.max(1,T.S(.4));
  ctx.beginPath(); ctx.moveTo(T.S(-w/2),0); ctx.lineTo(T.S(w/2),0); ctx.stroke();
  if (lit !== false){
    ctx.fillStyle="rgba(255,206,140,.8)";
    const cols=Math.max(2,Math.round(w/9)), rows=Math.max(1,Math.round(h/10));
    for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
      if (((i*7+j*13)%3)===0) continue;
      ctx.fillRect(T.S(-w/2+3+i*(w-6)/cols), T.S(-h/2+3+j*(h-6)/rows),
                   Math.max(1,T.S(2.2)), Math.max(1,T.S(1.8)));
    }
  }
  ctx.restore();
}
function CITYONLY(x,y){ return inPoly(x,y,G.CITY,[[14000,14000],[-9000,14000]]); }

// =====================================================================
// THE CITY. Built, not scattered. A block in San Francisco is about 275 by
// 412 feet, which is 92 by 137 yards, and the traffic is drawn at its true
// length in the same units, so a city block comes out a little longer than
// a ferry. That is the proportion it should be. Buildings sit in LOTS inside
// each block and cannot overlap, because they are laid out, not sprinkled.
//
// The cost of the 30 per cent compression is that only a handful of blocks
// fit where forty belong, so this is a small downtown. Correct proportions
// were the priority.
// =====================================================================
const BLOCK_W = 92, BLOCK_H = 137, STREET = 26;
const GRID_A = -0.58;                    // the downtown grid, canted to the bay
const CITY_ORIGIN = { x: 0, y: 0 };
let CITY_BLOCKS = null;
function buildCity(){
  const ca = Math.cos(GRID_A), sa = Math.sin(GRID_A);
  CITY_ORIGIN.x = G.FERRY_BUILDING.x - 250;
  CITY_ORIGIN.y = G.FERRY_BUILDING.y - 40;
  const blocks = [];
  for (let i = -3; i <= 7; i++){
    for (let j = -4; j <= 5; j++){
      const d1 = i * (BLOCK_W + STREET), d2 = j * (BLOCK_H + STREET);
      const cx = CITY_ORIGIN.x + ca*d1 - sa*d2;
      const cy = CITY_ORIGIN.y + sa*d1 + ca*d2;
      if (!CITYONLY(cx, cy)) continue;
      // the whole block must be ashore, or half a building ends up in the bay
      let ok = true;
      for (const [ox, oy] of [[-.5,-.5],[.5,-.5],[-.5,.5],[.5,.5]]){
        const px = cx + ca*(ox*BLOCK_W) - sa*(oy*BLOCK_H);
        const py = cy + sa*(ox*BLOCK_W) + ca*(oy*BLOCK_H);
        if (!CITYONLY(px, py)) { ok = false; break; }
      }
      if (!ok) continue;
      // lots: two across, three deep, each with its own building
      const lots = [];
      for (let lx = 0; lx < 2; lx++){
        for (let ly = 0; ly < 3; ly++){
          const seed = (i+9)*137 + (j+9)*31 + lx*7 + ly;
          const m = 5 + rnd2(seed)*5;                       // a little air round it
          const w = BLOCK_W/2 - m, h = BLOCK_H/3 - m;
          const ox = (lx - .5) * (BLOCK_W/2);
          const oy = (ly - 1)  * (BLOCK_H/3);
          lots.push({ ox, oy, w, h,
                      tall: rnd2(seed+3) > .66,
                      tone: rnd2(seed+5) });
        }
      }
      blocks.push({ cx, cy, lots });
    }
  }
  CITY_BLOCKS = blocks;
}
function onScreen(x, y, pad){
  const sx = T.X(x), sy = T.Y(y), p = pad || 0;
  return sx > -p && sx < W + p && sy > -p && sy < H + p;
}
function drawTown(){
  if (!CITY_BLOCKS) buildCity();
  const ca = Math.cos(GRID_A), sa = Math.sin(GRID_A);

  // the streets: the ground between the blocks, and lamps down them
  ctx.save();
  landPoly(G.CITY, [[14000,14000],[-9000,14000]]); ctx.clip();
  ctx.fillStyle = "#2d3128";
  for (const b of CITY_BLOCKS){
    if (!onScreen(b.cx, b.cy, T.S(160))) continue;
    ctx.save(); ctx.translate(T.X(b.cx), T.Y(b.cy)); ctx.rotate(GRID_A);
    ctx.fillStyle = "#3a3f33";                              // the street surface
    ctx.fillRect(T.S(-(BLOCK_W+STREET)/2), T.S(-(BLOCK_H+STREET)/2),
                 T.S(BLOCK_W+STREET), T.S(BLOCK_H+STREET));
    ctx.fillStyle = "#23281f";                              // the block itself
    ctx.fillRect(T.S(-BLOCK_W/2), T.S(-BLOCK_H/2), T.S(BLOCK_W), T.S(BLOCK_H));
    ctx.restore();
  }
  // buildings, one to a lot, so nothing overlaps anything
  for (const b of CITY_BLOCKS){
    if (!onScreen(b.cx, b.cy, T.S(160))) continue;
    ctx.save(); ctx.translate(T.X(b.cx), T.Y(b.cy)); ctx.rotate(GRID_A);
    for (const L of b.lots){
      const x = L.ox - L.w/2, y = L.oy - L.h/2;
      ctx.fillStyle = "rgba(4,6,10,.6)";                    // its shadow
      ctx.fillRect(T.S(x)+T.S(2.5), T.S(y)+T.S(3), T.S(L.w), T.S(L.h));
      ctx.fillStyle = L.tall ? "#565f4e" : (L.tone > .5 ? "#464e3e" : "#3d4536");
      ctx.fillRect(T.S(x), T.S(y), T.S(L.w), T.S(L.h));
      ctx.fillStyle = L.tall ? "#636d59" : "#4e5745";       // the lit roof plane
      ctx.fillRect(T.S(x), T.S(y), T.S(L.w), T.S(L.h*.45));
      ctx.strokeStyle = "rgba(10,14,10,.7)"; ctx.lineWidth = Math.max(1, T.S(.5));
      ctx.strokeRect(T.S(x), T.S(y), T.S(L.w), T.S(L.h));
      // windows in rows, and only some of them burning
      ctx.fillStyle = "rgba(255,206,140,.85)";
      const cols = Math.max(2, Math.round(L.w/9)), rows = Math.max(2, Math.round(L.h/11));
      for (let i2=0;i2<cols;i2++) for (let j2=0;j2<rows;j2++){
        if (((i2*5 + j2*3 + Math.round(L.ox)) % 4) === 0) continue;
        ctx.fillRect(T.S(x + 2.5 + i2*(L.w-5)/cols), T.S(y + 2.5 + j2*(L.h-5)/rows),
                     Math.max(1, T.S(2.4)), Math.max(1, T.S(2)));
      }
    }
    ctx.restore();
  }
  ctx.restore();

  // street lamps along the front
  for (const b of CITY_BLOCKS){
    if (!onScreen(b.cx, b.cy, T.S(120))) continue;
    stamp(ctx, BLOB_LAMP, T.X(b.cx), T.Y(b.cy), Math.max(8, T.S(90)), .13);
  }

  // outside downtown these are posts and settlements, not a grid: a few
  // buildings each, laid out along the shore, never on top of one another
  for (const b of G.BUILDINGS){
    if (b.name === "" && Math.hypot(b.x-G.FERRY_BUILDING.x, b.y-G.FERRY_BUILDING.y) < 900) continue;
    const n = 5;
    for (let i=0;i<n;i++){
      const r0 = rnd2(i*13 + Math.round(b.x));
      const ang = Math.atan2(b.y - G.FORT_POINT.y, b.x - G.FORT_POINT.x) + Math.PI/2;
      const off = (i - (n-1)/2) * (b.w*.55);
      const hx = b.x + Math.cos(ang)*off, hy = b.y + Math.sin(ang)*off;
      if (!onLand(hx, hy)) continue;
      block(hx, hy, b.w*.4 + r0*8, b.h*.45 + r0*6, ang);
    }
    if (b.name && T.k>.4){
      ctx.globalAlpha=.6; ctx.fillStyle="#b9c6d1";
      ctx.font=`12px ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign="center"; ctx.fillText(b.name, T.X(b.x), T.Y(b.y)-T.S(b.h*.9));
      ctx.globalAlpha=1;
    }
  }
}

// The seawall, and the piers standing out from it at right angles with a
// shed the length of each. They are attached to the shore, because a pier
// that floats free of the land is not a pier.
function drawWaterfront(){
  const SW = G.SEAWALL;
  ctx.strokeStyle = "#5b636a"; ctx.lineWidth = Math.max(2, T.S(7));
  ctx.beginPath();
  ctx.moveTo(T.X(SW[0][0]), T.Y(SW[0][1]));
  for (const [x,y] of SW) ctx.lineTo(T.X(x), T.Y(y));
  ctx.stroke();
  ctx.strokeStyle = "rgba(200,214,226,.45)"; ctx.lineWidth = Math.max(1, T.S(1.2));
  ctx.stroke();

  for (let i = 0; i < SW.length - 1; i++){
    const a = SW[i], b2 = SW[i+1];
    const len = Math.hypot(b2[0]-a[0], b2[1]-a[1]);
    const nx = (b2[1]-a[1])/len, ny = -(b2[0]-a[0])/len;   // seaward normal
    const n = Math.max(1, Math.round(len/64));
    for (let k = 0; k < n; k++){
      const f = (k + .5)/n;
      const rx = a[0] + (b2[0]-a[0])*f, ry = a[1] + (b2[1]-a[1])*f;
      // skip the stretch the Ferry Building and your own wharf occupy
      if (Math.hypot(rx-G.FERRY_BUILDING.x, ry-G.FERRY_BUILDING.y) < 130) continue;
      if (Math.hypot(rx-G.WHARF.rootX, ry-G.WHARF.rootY) < 120) continue;
      const pl = 78 + (k%3)*22, pw = 24;
      const ang = Math.atan2(ny, nx);
      ctx.save(); ctx.translate(T.X(rx), T.Y(ry)); ctx.rotate(ang);
      ctx.fillStyle="rgba(4,6,10,.55)";
      ctx.fillRect(0, T.S(-pw/2)+T.S(2), T.S(pl), T.S(pw));
      ctx.fillStyle="#464f57";                              // the pier deck
      ctx.fillRect(0, T.S(-pw/2), T.S(pl), T.S(pw));
      ctx.strokeStyle="rgba(20,26,32,.7)"; ctx.lineWidth=Math.max(1,T.S(.5));
      for (let q=0;q<=8;q++){                               // the piles under it
        ctx.beginPath();
        ctx.moveTo(T.S(q*pl/8), T.S(-pw/2)); ctx.lineTo(T.S(q*pl/8), T.S(pw/2));
        ctx.stroke();
      }
      ctx.fillStyle="#576169";                              // the shed on it
      ctx.fillRect(T.S(8), T.S(-pw/2+3), T.S(pl-18), T.S(pw-6));
      ctx.fillStyle="#646f78";
      ctx.fillRect(T.S(8), T.S(-pw/2+3), T.S(pl-18), T.S((pw-6)/2));
      ctx.fillStyle="rgba(255,206,140,.6)";
      for (let q=0;q<5;q++) ctx.fillRect(T.S(14+q*(pl-30)/5), T.S(-2), T.S(3), T.S(4));
      ctx.restore();
    }
  }
}

function drawFerryBuilding(){
  const f = G.FERRY_BUILDING;
  // She is 660 feet long, which is 220 yards: nearly three times a ferry.
  const LEN = 210, WID = 34;
  // the slips first, cut into the front, with the building at their head
  for (const sl of G.SLIPS){
    ctx.fillStyle = "#0e161d";                               // water in the pen
    ctx.fillRect(T.X(sl.headX), T.Y(sl.y)-T.S(sl.wide/2), T.S(sl.len), T.S(sl.wide));
    ctx.fillStyle = "#4a545c";                               // piling either side
    ctx.fillRect(T.X(sl.headX), T.Y(sl.y)-T.S(sl.wide/2+3), T.S(sl.len), T.S(3));
    ctx.fillRect(T.X(sl.headX), T.Y(sl.y)+T.S(sl.wide/2),   T.S(sl.len), T.S(3));
    ctx.fillStyle = "rgba(255,214,150,.9)";                  // lamp on each pile head
    ctx.fillRect(T.X(sl.mouthX)-T.S(1.5), T.Y(sl.y)-T.S(sl.wide/2+3), T.S(3), T.S(3));
    ctx.fillRect(T.X(sl.mouthX)-T.S(1.5), T.Y(sl.y)+T.S(sl.wide/2),   T.S(3), T.S(3));
    ctx.fillStyle = "#6b7680";                               // the apron at her head
    ctx.fillRect(T.X(sl.headX)-T.S(6), T.Y(sl.y)-T.S(sl.wide/2), T.S(6), T.S(sl.wide));
  }
  // the building itself
  ctx.fillStyle="rgba(4,6,10,.6)";
  ctx.fillRect(T.X(f.x)+T.S(3), T.Y(f.y)-T.S(LEN/2)+T.S(3), T.S(WID), T.S(LEN));
  ctx.fillStyle="#5a6670";
  ctx.fillRect(T.X(f.x), T.Y(f.y)-T.S(LEN/2), T.S(WID), T.S(LEN));
  ctx.fillStyle="#6b7680";
  ctx.fillRect(T.X(f.x), T.Y(f.y)-T.S(LEN/2), T.S(WID/2), T.S(LEN));
  ctx.strokeStyle="rgba(20,26,32,.65)"; ctx.lineWidth=Math.max(1,T.S(.5));
  ctx.strokeRect(T.X(f.x), T.Y(f.y)-T.S(LEN/2), T.S(WID), T.S(LEN));
  // the arcade along the whole front, arch by arch
  ctx.strokeStyle="rgba(210,222,232,.5)"; ctx.lineWidth=Math.max(1,T.S(.45));
  for (let i=-24;i<=24;i++){
    ctx.beginPath();
    ctx.moveTo(T.X(f.x), T.Y(f.y+i*4.2)); ctx.lineTo(T.X(f.x+WID), T.Y(f.y+i*4.2));
    ctx.stroke();
  }
  ctx.fillStyle="rgba(255,214,150,.8)";
  for (let i=-23;i<=23;i++) ctx.fillRect(T.X(f.x+3), T.Y(f.y+i*4.2)-T.S(.9), T.S(6), T.S(1.8));
  // the 1898 clock tower at the middle, 245 feet, with its lit face
  ctx.fillStyle="rgba(4,6,10,.6)";
  ctx.fillRect(T.X(f.x+WID*.2)+T.S(3), T.Y(f.y)-T.S(13)+T.S(3), T.S(22), T.S(26));
  ctx.fillStyle="#7d8892";
  ctx.fillRect(T.X(f.x+WID*.2), T.Y(f.y)-T.S(13), T.S(22), T.S(26));
  ctx.fillStyle="#98a3ad";
  ctx.fillRect(T.X(f.x+WID*.2+3), T.Y(f.y)-T.S(10), T.S(16), T.S(20));
  ctx.fillStyle="rgba(255,238,196,.95)";
  ctx.beginPath();
  ctx.arc(T.X(f.x+WID*.2+11), T.Y(f.y), Math.max(2.5,T.S(6)), 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle="#4a5058"; ctx.lineWidth=Math.max(1,T.S(.6));
  ctx.beginPath();
  ctx.moveTo(T.X(f.x+WID*.2+11), T.Y(f.y));
  ctx.lineTo(T.X(f.x+WID*.2+15), T.Y(f.y)-T.S(2.4)); ctx.stroke();
  if (T.k > .25){
    ctx.globalAlpha=.85; ctx.fillStyle="#e2e9ef";
    ctx.font=`${Math.max(11,Math.min(17,T.S(11)))}px ${getComputedStyle(document.body).fontFamily}`;
    ctx.textAlign="left";
    ctx.fillText("the Ferry Building", T.X(f.x+WID+10), T.Y(f.y)); ctx.globalAlpha=1;
  }
}

function drawLights(t){
  for (const L of G.LIGHTS){
    let on = 1;
    if (L.period) on = (t % L.period) < L.period*.72 ? 1 : .12;   // occulting
    const r = T.S(L.range * G.COMPRESS) * (.5 + .5*on);
    const g = ctx.createRadialGradient(T.X(L.x),T.Y(L.y),0,T.X(L.x),T.Y(L.y),Math.max(8,r));
    g.addColorStop(0, L.col.replace(")", "") );
    ctx.save();
    ctx.globalAlpha = .30*on;
    const grd = ctx.createRadialGradient(T.X(L.x),T.Y(L.y),0,T.X(L.x),T.Y(L.y),Math.max(10,r));
    grd.addColorStop(0, L.col); grd.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grd;
    ctx.fillRect(T.X(L.x)-r, T.Y(L.y)-r, r*2, r*2);
    ctx.restore();
    ctx.fillStyle = L.col; ctx.globalAlpha = on;
    ctx.beginPath(); ctx.arc(T.X(L.x), T.Y(L.y), Math.max(2,T.S(7)), 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    if (T.k > .16){
      ctx.globalAlpha=.7; ctx.fillStyle="#b9c6d1";
      ctx.font = `${Math.max(9,Math.min(13,T.S(10)))}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign="center";
      ctx.fillText(L.name, T.X(L.x), T.Y(L.y)-T.S(16)); ctx.globalAlpha=1;
    }
  }
}
function drawHazards(t){
  for (const h of G.HAZARDS){
    const br = .4+.6*Math.max(0,Math.sin(t*.9+h.x*.004));
    ctx.globalAlpha = .12+.34*br; ctx.fillStyle = C.foam;
    ctx.beginPath(); ctx.ellipse(T.X(h.x),T.Y(h.y),T.S(h.r*1.7),T.S(h.r*1.3),0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    if (!h.shape) h.shape = rockShape((h.x*7919)|0, h.r, 11);
    ctx.beginPath();
    ctx.moveTo(T.X(h.x+h.shape[0][0]), T.Y(h.y+h.shape[0][1]));
    for (const [sx,sy] of h.shape) ctx.lineTo(T.X(h.x+sx), T.Y(h.y+sy));
    ctx.closePath();
    ctx.fillStyle = "#2b3742"; ctx.fill();
    ctx.strokeStyle="rgba(210,226,238,.5)"; ctx.lineWidth=Math.max(1,T.S(1.2)); ctx.stroke();
    ctx.save(); ctx.clip();
    ctx.fillStyle="rgba(170,190,206,.3)";
    ctx.beginPath();
    ctx.moveTo(T.X(h.x-h.r),T.Y(h.y-h.r)); ctx.lineTo(T.X(h.x+h.r*.5),T.Y(h.y-h.r));
    ctx.lineTo(T.X(h.x-h.r*.45),T.Y(h.y+h.r*.35)); ctx.closePath(); ctx.fill();
    ctx.fillStyle="rgba(6,9,13,.5)";
    ctx.beginPath();
    ctx.moveTo(T.X(h.x+h.r),T.Y(h.y+h.r)); ctx.lineTo(T.X(h.x+h.r),T.Y(h.y-h.r*.2));
    ctx.lineTo(T.X(h.x-h.r*.2),T.Y(h.y+h.r)); ctx.closePath(); ctx.fill();
    ctx.restore();
    if (h.name === "MILE ROCKS" && T.k > .14){
      ctx.globalAlpha=.85; ctx.fillStyle="#e2705a";
      ctx.font = `${Math.max(10,Math.min(14,T.S(12)))}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign="center";
      ctx.fillText("Mile Rocks, unlit", T.X(h.x), T.Y(h.y)-T.S(h.r+14)); ctx.globalAlpha=1;
    }
  }
}
// Each class drawn as itself, from above. You should be able to tell a
// battleship from a ferry from a hay scow at a glance, because in a crowded
// bay that is the whole of the problem.
function drawTrafficVessel(v, t){
  const x=T.X(v.x), y=T.Y(v.y);
  const L=v.len, B=L*(v.kind==="scow"?.34:v.kind==="cruiser"?.155:v.kind==="ferry"?.28:.22);
  ctx.save(); ctx.translate(x,y); ctx.rotate(v.hdg||0);
  const S=T.S;

  // her wash, if she is moving
  if (v.sp){
    ctx.globalAlpha=.16; ctx.fillStyle="#0c161d";
    ctx.beginPath(); ctx.ellipse(0,S(L*.6),S(B*.5),S(L*.2),0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  // hull
  ctx.beginPath();
  if (v.kind==="scow"){                                  // flat-bowed, a box
    ctx.rect(S(-B/2), S(-L/2), S(B), S(L));
  } else {
    ctx.moveTo(0,S(-L/2));
    ctx.bezierCurveTo(S(B*.5),S(-L*.3),S(B*.5),S(L*.2),S(B*.42),S(L/2));
    ctx.lineTo(S(-B*.42),S(L/2));
    ctx.bezierCurveTo(S(-B*.5),S(L*.2),S(-B*.5),S(-L*.3),0,S(-L/2));
  }
  ctx.closePath();
  ctx.fillStyle = v.kind==="cruiser" ? "#d9dcd6"         // WHITE HULL, 1905 navy
                : v.kind==="ferry" ? "#2b3a45"
                : v.kind==="scow" ? "#2f3a33" : "#141d26";
  ctx.fill();
  ctx.strokeStyle = v.kind==="cruiser" ? "rgba(40,48,44,.6)" : "rgba(160,180,196,.45)";
  ctx.lineWidth=Math.max(1,S(.9)); ctx.stroke();

  if (v.kind==="cruiser"){
    // USS OLYMPIA, from directly above. Forward to aft: a RAM BOW, the
    // raised forecastle with the forward 8-inch turret on it, the bridge and
    // conning tower, TWO FUNNELS CLOSE TOGETHER amidships with the boats on
    // skids between them, the after superstructure, the after turret, and a
    // low quarterdeck. Ten 5-inch guns live in SPONSONS that stand out from
    // her sides, which from above is what tells a cruiser from a battleship.
    // White hull, buff upperworks: the scheme the Navy wore until 1909.
    const su = L*.40, suW = B*.52;

    // the ram: her stem carries on underwater, so she is pointed
    ctx.fillStyle="#cfd2cb";
    ctx.beginPath();
    ctx.moveTo(0, S(-L*.52));
    ctx.bezierCurveTo(S(B*.40), S(-L*.30), S(B*.42), S(L*.10), S(B*.34), S(L*.42));
    ctx.lineTo(S(-B*.34), S(L*.42));
    ctx.bezierCurveTo(S(-B*.42), S(L*.10), S(-B*.40), S(-L*.30), 0, S(-L*.52));
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle="rgba(70,76,70,.55)"; ctx.lineWidth=Math.max(1,S(.4)); ctx.stroke();

    // the sponsons: five a side, standing out from the hull
    ctx.fillStyle="#c1c4bc";
    for (let i=-2;i<=2;i++){
      const sy2 = i*L*.085;
      ctx.beginPath();
      ctx.ellipse(S(-B*.46), S(sy2), S(B*.10), S(L*.035), 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.ellipse(S(B*.46), S(sy2), S(B*.10), S(L*.035), 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle="#6e6553"; ctx.lineWidth=Math.max(1,S(.8));
      ctx.beginPath();
      ctx.moveTo(S(-B*.52), S(sy2)); ctx.lineTo(S(-B*.66), S(sy2 - L*.012)); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(S(B*.52), S(sy2)); ctx.lineTo(S(B*.66), S(sy2 - L*.012)); ctx.stroke();
    }

    // the raised forecastle
    ctx.fillStyle="#d9dcd4";
    ctx.beginPath();
    ctx.moveTo(0, S(-L*.50));
    ctx.bezierCurveTo(S(B*.34), S(-L*.34), S(B*.34), S(-L*.20), S(B*.28), S(-L*.16));
    ctx.lineTo(S(-B*.28), S(-L*.16));
    ctx.bezierCurveTo(S(-B*.34), S(-L*.20), S(-B*.34), S(-L*.34), 0, S(-L*.50));
    ctx.closePath(); ctx.fill();

    // superstructure, buff, tapered to her
    ctx.fillStyle="#c6ae76";
    ctx.beginPath();
    ctx.moveTo(0, S(-su*.62));
    ctx.bezierCurveTo(S(suW*.5), S(-su*.3), S(suW*.5), S(su*.2), S(suW*.38), S(su*.5));
    ctx.lineTo(S(-suW*.38), S(su*.5));
    ctx.bezierCurveTo(S(-suW*.5), S(su*.2), S(-suW*.5), S(-su*.3), 0, S(-su*.62));
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle="rgba(70,62,44,.5)"; ctx.lineWidth=Math.max(1,S(.35)); ctx.stroke();

    // conning tower and bridge
    ctx.fillStyle="#93876a";
    ctx.beginPath(); ctx.arc(0, S(-su*.46), S(B*.12), 0, Math.PI*2); ctx.fill();
    ctx.fillStyle="#b4a47e";
    ctx.fillRect(S(-suW*.46), S(-su*.40), S(suW*.92), S(L*.035));

    // TWO FUNNELS, CLOSE TOGETHER, which is Olympia's signature from above
    for (const fy of [-L*.03, L*.055]){
      ctx.fillStyle="#8a7a55";
      ctx.beginPath(); ctx.ellipse(0, S(fy), S(B*.17), S(B*.13), 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle="#4f4739";
      ctx.beginPath(); ctx.ellipse(0, S(fy), S(B*.10), S(B*.075), 0, 0, Math.PI*2); ctx.fill();
    }
    // boats on skids between and beside them
    ctx.fillStyle="#7e7360";
    for (const bx of [-suW*.42, suW*.42]){
      for (const by of [-L*.012, L*.03]){
        ctx.fillRect(S(bx-B*.05), S(by), S(B*.1), S(L*.05));
      }
    }

    // the two 8-inch turrets, twin guns in each, fore and aft
    for (const [ty, out] of [[-L*.30,-1],[L*.33,1]]){
      ctx.fillStyle="#a89c80";
      ctx.beginPath(); ctx.arc(0, S(ty), S(B*.26), 0, Math.PI*2); ctx.fill();
      ctx.fillStyle="#6c6659";
      ctx.beginPath(); ctx.arc(0, S(ty), S(B*.20), 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle="rgba(40,40,36,.7)"; ctx.lineWidth=Math.max(1,S(.4));
      ctx.beginPath(); ctx.arc(0, S(ty), S(B*.20), 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle="#33322c"; ctx.lineWidth=Math.max(1.2,S(1.1));
      for (const gx of [-B*.07, B*.07]){
        ctx.beginPath();
        ctx.moveTo(S(gx), S(ty));
        ctx.lineTo(S(gx), S(ty + out*L*.115));
        ctx.stroke();
      }
    }

    // two military masts with circular fighting tops
    for (const my of [-su*.34, su*.44]){
      ctx.fillStyle="#7a7160";
      ctx.beginPath(); ctx.arc(0, S(my), S(B*.095), 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle="#d3ccb8"; ctx.lineWidth=Math.max(1,S(.45));
      ctx.beginPath(); ctx.arc(0, S(my), S(B*.095), 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle="#3f3c34";
      ctx.beginPath(); ctx.arc(0, S(my), S(B*.03), 0, Math.PI*2); ctx.fill();
    }
    // ensign aft, jack forward
    ctx.fillStyle="#e4e9ee";
    ctx.fillRect(S(-1.1), S(L*.43), S(2.2), S(L*.04));
    ctx.fillRect(S(-1.1), S(-L*.52), S(2.2), S(L*.035));
  } else if (v.kind==="ferry"){
    // a double-ender: houses the full length, walking beam amidships,
    // windows lit all the way along, and a paddle box each side
    ctx.fillStyle="#46555f";
    ctx.fillRect(S(-B*.36),S(-L*.42),S(B*.72),S(L*.84));
    ctx.fillStyle="rgba(255,206,140,.75)";
    for(let i=-6;i<=6;i++) ctx.fillRect(S(-B*.3),S(i*L*.062),S(B*.6),S(L*.022));
    ctx.fillStyle="#5d6c76";
    ctx.fillRect(S(-B*.56),S(-L*.10),S(B*.2),S(L*.2));
    ctx.fillRect(S(B*.36),S(-L*.10),S(B*.2),S(L*.2));
    ctx.fillStyle="#2a2118";
    ctx.beginPath(); ctx.ellipse(0,0,S(B*.1),S(B*.08),0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#e2705a"; ctx.fillRect(S(-B/2),S(-L*.44),S(2.6),S(2.6));
    ctx.fillStyle="#7fd6a2"; ctx.fillRect(S(B/2-2.6),S(-L*.44),S(2.6),S(2.6));
  } else if (v.kind==="steamer"){
    ctx.fillStyle="#2b3742";
    ctx.fillRect(S(-B*.3),S(-L*.1),S(B*.6),S(L*.34));
    ctx.fillStyle="#3a2f22";                             // one tall funnel
    ctx.beginPath(); ctx.ellipse(0,S(L*.02),S(B*.15),S(B*.12),0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#2a2118"; ctx.lineWidth=Math.max(1,S(.8));
    for(const my of [-L*.3, L*.34]){ ctx.beginPath();
      ctx.moveTo(S(-B*.8),S(my)); ctx.lineTo(S(B*.8),S(my)); ctx.stroke(); }
    ctx.fillStyle="rgba(255,206,140,.6)"; ctx.fillRect(S(-B*.12),S(L*.12),S(B*.24),S(L*.05));
  } else if (v.kind==="schooner"){
    ctx.fillStyle="#c8781f";                             // deckload of lumber
    ctx.fillRect(S(-B*.34),S(-L*.28),S(B*.68),S(L*.46));
    ctx.fillStyle="#2b3742";
    ctx.fillRect(S(-B*.3),S(L*.24),S(B*.6),S(L*.18));
    ctx.fillStyle="#3a2f22";
    ctx.beginPath(); ctx.ellipse(0,S(L*.3),S(B*.12),S(B*.1),0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#2a2118"; ctx.lineWidth=Math.max(1,S(.8));
    for(const my of [-L*.34, L*.16]){ ctx.beginPath();
      ctx.moveTo(0,S(my)); ctx.lineTo(S(B*1.1),S(my+L*.2)); ctx.stroke(); }
  } else if (v.kind==="square"){
    ctx.fillStyle="#1b242c";
    ctx.fillRect(S(-B*.3),S(-L*.05),S(B*.6),S(L*.2));
    ctx.strokeStyle="#2a2118"; ctx.lineWidth=Math.max(1,S(1.1));
    for(const my of [-L*.28, -L*.02, L*.24]){            // three squared yards
      ctx.beginPath(); ctx.moveTo(S(-B*1.5),S(my)); ctx.lineTo(S(B*1.5),S(my)); ctx.stroke();
      ctx.globalAlpha=.16; ctx.fillStyle="#8d97a2";
      ctx.fillRect(S(-B*1.4),S(my),S(B*2.8),S(L*.1)); ctx.globalAlpha=1;
    }
    ctx.strokeStyle="rgba(206,198,180,.5)"; ctx.lineWidth=Math.max(1,S(.7));
    ctx.beginPath(); ctx.moveTo(0,S(-L/2)); ctx.lineTo(0,S(-L*.95)); ctx.stroke();
  } else if (v.kind==="tug"){
    ctx.fillStyle="#2b3742";
    ctx.fillRect(S(-B*.34),S(-L*.08),S(B*.68),S(L*.3));
    ctx.fillStyle="#3a2f22";
    ctx.beginPath(); ctx.ellipse(0,S(L*.02),S(B*.2),S(B*.16),0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="rgba(255,206,140,.7)"; ctx.fillRect(S(-B*.14),S(-L*.04),S(B*.28),S(L*.06));
  } else if (v.kind==="scow"){
    ctx.fillStyle="#7a5a2c";                             // her hay deckload
    ctx.fillRect(S(-B*.42),S(-L*.34),S(B*.84),S(L*.56));
    ctx.strokeStyle="#2a2118"; ctx.lineWidth=Math.max(1,S(.8));
    ctx.beginPath(); ctx.moveTo(0,S(-L*.1)); ctx.lineTo(S(B*.9),S(L*.2)); ctx.stroke();
  } else if (v.kind==="anchored"){
    ctx.fillStyle="rgba(255,226,170,.8)";
    ctx.beginPath(); ctx.arc(0,S(-L*.45),Math.max(1.5,S(2.4)),0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#2a2118"; ctx.lineWidth=Math.max(1,S(.8));
    for(const my of [-L*.2, L*.14]){ ctx.beginPath();
      ctx.moveTo(0,S(my)); ctx.lineTo(S(B*.9),S(my+L*.18)); ctx.stroke(); }
  }
  ctx.restore();

  // name her when she is close enough to matter
  if (v.name && T.k > .35 && Math.hypot(v.x-ship.x, v.y-ship.y) < 420){
    ctx.globalAlpha=.6; ctx.fillStyle="#b9c6d1";
    ctx.font = `11px ${getComputedStyle(document.body).fontFamily}`;
    ctx.textAlign="center";
    ctx.fillText(v.name, x, y - T.S(v.len*.62));
    ctx.globalAlpha=1;
  }
}
function drawTraffic(t){
  const all = traffic.concat(ANCHORAGE
    .map((a,i)=>({ x:a.x, y:a.y, hdg:.5+i*.4, kind:"anchored", len:64 })));
  for (const v of all){
    const x=T.X(v.x), y=T.Y(v.y);
    if (x<-200||x>W+200||y<-200||y>H+200) continue;
    drawTrafficVessel(v, t);
  }
}

// The wind, drawn on the water: streaks running downwind, fast, so you can
// see which way it is blowing without reading it off a line of type.
function drawWind(t){
  const r = (env.windFrom + 180) * Math.PI/180;
  const ux = Math.sin(r), uy = -Math.cos(r);
  const cell = 90, hw = W/2/T.k, hh = H/2/T.k;
  const i0 = Math.floor((cam.x-hw)/cell), i1 = Math.ceil((cam.x+hw)/cell);
  const j0 = Math.floor((cam.y-hh)/cell), j1 = Math.ceil((cam.y+hh)/cell);
  if ((i1-i0)*(j1-j0) > 3000) return;
  const run = 26 + env.windKn * 1.6;
  ctx.strokeStyle = "rgba(196,216,232,.16)";
  ctx.lineWidth = Math.max(1, T.S(1));
  ctx.beginPath();
  for (let j=j0;j<=j1;j++) for (let i=i0;i<=i1;i++){
    const h = (((i*73856093)^(j*19349663))>>>0);
    const ph = (h % 1000)/1000;
    const trav = ((t * (env.windKn*2.4) / cell) + ph) % 1;
    const bx = i*cell + (h%997)/997*cell + ux*trav*cell*3;
    const by = j*cell + ((h>>10)%991)/991*cell + uy*trav*cell*3;
    ctx.moveTo(T.X(bx), T.Y(by));
    ctx.lineTo(T.X(bx + ux*run), T.Y(by + uy*run));
  }
  ctx.stroke();
}
// and a rose, so the wind, the tide and her head are all in one place
function drawRose(){
  const R = Math.min(94, W*.07), cx = W - R - 34, cy = 210 + R;
  ctx.save();
  ctx.globalAlpha=.75; ctx.strokeStyle="rgba(170,186,200,.55)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
  for(let i=0;i<16;i++){ const a=i*Math.PI/8-Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*(i%4?R*.9:R*.78), cy+Math.sin(a)*(i%4?R*.9:R*.78));
    ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R); ctx.stroke(); }
  ctx.fillStyle="#8b97a3"; ctx.font=`10px ${getComputedStyle(document.body).fontFamily}`;
  ctx.textAlign="center"; ctx.fillText("N", cx, cy-R-6);
  const arrow=(deg,len,col,w)=>{ const a=(deg-90)*Math.PI/180;
    const ex=cx+Math.cos(a)*len, ey=cy+Math.sin(a)*len;
    ctx.globalAlpha=1; ctx.strokeStyle=col; ctx.lineWidth=w;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.save(); ctx.translate(ex,ey); ctx.rotate(a); ctx.fillStyle=col;
    ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(-5,4); ctx.lineTo(-5,-4);
    ctx.closePath(); ctx.fill(); ctx.restore(); };
  arrow((env.windFrom+180)%360, R*.85, "rgba(226,236,244,.8)", 2.2);
  const setDir=(Math.atan2(env.curX,-env.curY)*180/Math.PI+360)%360;
  arrow(setDir, R*.55, "rgba(242,166,60,.9)", 2.4);
  arrow(degOf(ship.hdg), R*.4, "rgba(127,214,162,.9)", 2);
  ctx.globalAlpha=.6; ctx.textAlign="right";
  ctx.fillStyle="#cfd8e0"; ctx.fillText("wind", cx+R, cy+R+14);
  ctx.fillStyle="#f2a63c"; ctx.fillText("tide", cx+R, cy+R+27);
  ctx.fillStyle="#7fd6a2"; ctx.fillText("her head", cx+R, cy+R+40);
  ctx.restore();
}

// In fog you do not steer by what you can see, you steer by bearings. These
// are the marks a master would be taking: the lights, and the Gate itself.
function drawBearings(){
  const marks = [
    { p: G.PT_BONITA,  n: "Pt Bonita", c: "#fff2d0" },
    { p: G.LIME_POINT, n: "Lime Point", c: "#ff9a7a" },
    { p: G.FORT_POINT, n: "Fort Point", c: "#ffe8b8" },
    { p: G.ALCATRAZ,   n: "Alcatraz",  c: "#fff4dc" },
    { p: G.BERTH,      n: "the wharf", c: "#f2a63c" },
  ];
  const cx = W/2, cy = H/2, R = Math.min(W,H)*.42;
  for (const m of marks){
    const sx = T.X(m.p.x), sy = T.Y(m.p.y);
    if (sx > 30 && sx < W-30 && sy > 30 && sy < H-30) continue;
    const a = Math.atan2(sy-cy, sx-cx);
    const px = cx + Math.cos(a)*R, py = cy + Math.sin(a)*R;
    const dist = Math.hypot(m.p.x-ship.x, m.p.y-ship.y);
    ctx.save();
    ctx.translate(px,py); ctx.rotate(a);
    ctx.globalAlpha=.55; ctx.fillStyle=m.c;
    ctx.beginPath(); ctx.moveTo(11,0); ctx.lineTo(-7,5); ctx.lineTo(-7,-5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.globalAlpha=.6; ctx.fillStyle=m.c;
    ctx.font = `12px ${getComputedStyle(document.body).fontFamily}`;
    ctx.textAlign="center";
    ctx.fillText(`${m.n} ${(dist/2027).toFixed(1)} mi`,
                 px - Math.cos(a)*40, py - Math.sin(a)*26);
    ctx.globalAlpha=1;
  }
}

// A small chart in the corner, which is what you would have had on the table
// below. It shows the whole bay, where you are in it, and where the traffic
// is, because in this fog the deck view tells you almost nothing.
function drawMinimap(){
  const w = Math.min(300, W*.22), h = w*.62;
  const x0 = 22, y0 = H - h - 96;   // clear of the readout under it
  // the extent of the chart, in world yards
  const X0 = G.PT_BONITA.x - 260, X1 = G.FERRY_BUILDING.x + 260;
  const Y0 = G.ANGEL_IS.y - 200, Y1 = G.BERTH.y + 420;
  const k = Math.min(w/(X1-X0), h/(Y1-Y0));
  const mx = v => x0 + (v - X0)*k + (w - (X1-X0)*k)/2;
  const my = v => y0 + (v - Y0)*k + (h - (Y1-Y0)*k)/2;

  ctx.save();
  ctx.fillStyle="rgba(8,12,17,.82)";
  ctx.fillRect(x0-8, y0-8, w+16, h+16);
  ctx.strokeStyle="rgba(150,166,180,.45)"; ctx.lineWidth=1;
  ctx.strokeRect(x0-8, y0-8, w+16, h+16);
  ctx.beginPath(); ctx.rect(x0-8,y0-8,w+16,h+16); ctx.clip();

  const shore = (pts, closeTo, fill) => {
    ctx.beginPath();
    const all = pts.concat(closeTo);
    ctx.moveTo(mx(all[0][0]), my(all[0][1]));
    for (const [px,py] of all) ctx.lineTo(mx(px), my(py));
    ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
    ctx.strokeStyle="rgba(180,198,214,.55)"; ctx.lineWidth=1; ctx.stroke();
  };
  shore(G.MARIN, [[-9000,-14000],[14000,-14000]], "#22302a");
  shore(G.CITY,  [[14000,14000],[-9000,14000]],  "#2a2f24");
  for (const is of G.ISLANDS){
    ctx.beginPath();
    ctx.moveTo(mx(is.poly[0][0]), my(is.poly[0][1]));
    for (const [x,y] of is.poly) ctx.lineTo(mx(x), my(y));
    ctx.closePath();
    ctx.fillStyle="#2a3430"; ctx.fill();
    ctx.strokeStyle="rgba(180,198,214,.6)"; ctx.lineWidth=1; ctx.stroke();
  }
  // the lights
  for (const L of G.LIGHTS){
    ctx.fillStyle = L.col;
    ctx.beginPath(); ctx.arc(mx(L.x), my(L.y), 2.4, 0, Math.PI*2); ctx.fill();
  }
  // only what you have seen, and only where you last saw her
  for (const v of traffic){
    if (v.seen <= 0) continue;
    ctx.globalAlpha = .25 + .75 * v.seen;
    ctx.fillStyle = v.kind==="cruiser" ? "#e8eae4"
                  : v.kind==="ferry" ? "#9fc4dd" : "#7d8996";
    ctx.fillRect(mx(v.sx)-1.6, my(v.sy)-1.6, 3.2, 3.2);
    if (v.seen < .99){                                  // a stale contact
      ctx.strokeStyle = "rgba(190,204,216,.5)"; ctx.lineWidth = .8;
      ctx.strokeRect(mx(v.sx)-2.6, my(v.sy)-2.6, 5.2, 5.2);
    }
    ctx.globalAlpha = 1;
  }
  // where you are bound
  ctx.strokeStyle="#f2a63c"; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(mx(G.BERTH.x), my(G.BERTH.y), 5, 0, Math.PI*2); ctx.stroke();
  // and where you are, with your head
  const sx=mx(ship.x), sy=my(ship.y);
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(ship.hdg);
  ctx.fillStyle="#7fd6a2";
  ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(3.4,4); ctx.lineTo(-3.4,4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.restore();
}

// =====================================================================
// THE FOG IS THE GAME. You do not see the bay; you see a circle of water
// round your own vessel, and whatever is lit. A lighthouse throws a great
// pool of it. Another ship carries a small one, so she is a glow before she
// is a hull, and by then she is close. Everything else is wool.
//
// Done as a mask: an opaque fog layer with holes punched out of it, which is
// how you get hard-edged pools of visibility rather than a wash.
// =====================================================================
const fogCv = document.createElement("canvas");
const fog = fogCv.getContext("2d");

// A radial gradient built per call is the single most expensive thing in
// this scene: the fog alone wanted sixty-odd of them every frame. Build ONE
// soft disc as an image, and stamp it wherever a glow or a hole is needed.
function makeBlob(inner, r, g, b){
  const S2 = 128, c = document.createElement("canvas");
  c.width = c.height = S2;
  const x = c.getContext("2d");
  const grd = x.createRadialGradient(S2/2, S2/2, S2/2*inner, S2/2, S2/2, S2/2);
  grd.addColorStop(0, `rgba(${r},${g},${b},1)`);
  grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = grd; x.fillRect(0,0,S2,S2);
  return c;
}
const BLOB_HARD = makeBlob(.55, 0, 0, 0);     // for punching holes
const BLOB_SOFT = makeBlob(.18, 0, 0, 0);
const BLOB_WOOL = makeBlob(0, 140, 158, 174);
const BLOB_LAMP = makeBlob(0, 255, 206, 140);
function stamp(c2, img, x, y, r, alpha){
  if (!Number.isFinite(x) || !Number.isFinite(y) || !(r > 0)) return;
  c2.globalAlpha = alpha === undefined ? 1 : alpha;
  c2.drawImage(img, x - r, y - r, r*2, r*2);
  c2.globalAlpha = 1;
}
function hole(cx, cy, r, soft){
  stamp(fog, (soft ?? .55) > .35 ? BLOB_HARD : BLOB_SOFT, cx, cy, r);
}
function drawFog(t){
  if (fogCv.width !== W || fogCv.height !== H){ fogCv.width = W; fogCv.height = H; }
  fog.setTransform(1,0,0,1,0,0);
  fog.globalCompositeOperation = "source-over";
  fog.clearRect(0,0,W,H);

  // the wool itself: several layers of it, drifting downwind
  fog.fillStyle = "#5c6b78";
  fog.globalAlpha = .96;
  fog.fillRect(0,0,W,H);
  fog.globalAlpha = 1;
  const r = (env.windFrom + 180) * Math.PI/180;
  const ux = Math.sin(r), uy = -Math.cos(r);
  for (let i=0;i<26;i++){
    const ph = (t*.045*(1+(i%4)*.35) + i*.137) % 1;
    const bx = ((i*137)%100)/100*W + ux*ph*W*1.3 - ux*W*.15;
    const by = ((i*271)%100)/100*H + uy*ph*H*1.3 - uy*H*.15;
    const rr = 90 + (i%5)*70;
    stamp(fog, BLOB_WOOL, bx%W, by%H, rr, .55);
  }

  // now punch out what you can actually see
  fog.globalCompositeOperation = "destination-out";

  // your own circle: a schooner's deck, her lamps, and as far as that carries
  hole(T.X(ship.x), T.Y(ship.y), T.S(230) + 60, .30);

  // the lights. Point Bonita throws the big one, as it was built to.
  for (const L of G.LIGHTS){
    let on = 1;
    if (L.period) on = (t % L.period) < L.period*.72 ? 1 : .35;
    if (!onScreen(L.x, L.y, T.S(L.range * G.COMPRESS))) continue;
    const rr = T.S(L.range * G.COMPRESS * .62) * on;   // the chart is compressed
    if (rr < 4) continue;
    hole(T.X(L.x), T.Y(L.y), rr, .18);
  }
  // the towns ashore, which glow through it
  for (const b2 of G.BUILDINGS){ if (!onScreen(b2.x, b2.y, T.S(200))) continue;
    hole(T.X(b2.x), T.Y(b2.y), T.S(150), .2); }
  hole(T.X(G.FERRY_BUILDING.x), T.Y(G.FERRY_BUILDING.y), T.S(320), .25);
  hole(T.X(G.WHARF.x), T.Y(G.WHARF.y), T.S(170), .25);

  // every vessel carries her own small pool, so she looms
  for (const v of traffic){
    if (!Number.isFinite(v.x) || !onScreen(v.x, v.y, T.S(v.len*2) + 60)) continue;
    hole(T.X(v.x), T.Y(v.y), T.S(v.len*1.5) + 26, .22); }
  for (const a2 of ANCHORAGE){ if (!onScreen(a2.x, a2.y, T.S(140))) continue;
    hole(T.X(a2.x), T.Y(a2.y), T.S(70) + 14, .25); }

  fog.globalCompositeOperation = "source-over";
  ctx.drawImage(fogCv, 0, 0);

  // a last breath of it over everything, so nothing looks crisp
  ctx.globalAlpha = .07; ctx.fillStyle = "#8ea0ae";
  ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1;
}

// the lantern each vessel carries, drawn under her so she glows first
function drawLanterns(){
  for (const v of traffic){
    if (!Number.isFinite(v.x) || !Number.isFinite(v.y)) continue;
    if (!onScreen(v.x, v.y, T.S(v.len*2))) continue;
    stamp(ctx, BLOB_LAMP, T.X(v.x), T.Y(v.y), Math.max(20,T.S(v.len*1.4)), .30);
  }
  stamp(ctx, BLOB_LAMP, T.X(ship.x), T.Y(ship.y), Math.max(30, T.S(90)), .22);
}

// rocks along both shores, which you meet before you meet the shore
function drawShoreRocks(t){
  for (const rk of G.SHORE_ROCKS){
    const x=T.X(rk.x), y=T.Y(rk.y);
    if (x<-60||x>W+60||y<-60||y>H+60) continue;
    const brk = rk.awash ? (.35+.65*Math.max(0,Math.sin(t*.8+rk.x*.03))) : .55;
    ctx.globalAlpha=.10+.3*brk; ctx.fillStyle=C.foam;
    ctx.beginPath(); ctx.ellipse(x,y,T.S(rk.r*1.7),T.S(rk.r*1.3),0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    if (!rk.shape) rk.shape = rockShape(rk.seed, rk.r);
    ctx.beginPath();
    ctx.moveTo(x+T.S(rk.shape[0][0]), y+T.S(rk.shape[0][1]));
    for (const [sx,sy] of rk.shape) ctx.lineTo(x+T.S(sx), y+T.S(sy));
    ctx.closePath();
    ctx.fillStyle = rk.awash ? "#2b3742" : "#39444d"; ctx.fill();
    ctx.strokeStyle="rgba(12,17,23,.7)"; ctx.lineWidth=Math.max(1,T.S(.6)); ctx.stroke();
  }
}

// ------------------------------------------------------------- phases
let canMoor = false;
function unload(){
  phase="over";
  card(`<h1>Discharged</h1>
  <p>You are alongside at Steuart Street with <b>${Math.floor(ship.cargo)} cords</b> out of
  Fort Ross, and the Ferry Building clock going overhead.
  ${tows ? `You took a tug ${tows === 1 ? "once" : tows + " times"}, and the towage comes off what she made.` : "You worked her in under your own canvas the whole way."}</p>
  <p class="src">Mendocino and Sonoma cordwood and lumber came in here by the schooner-load:
  Cronise put the price in 1868 at twenty dollars a thousand feet rough and thirty dressed.
  Six months after this night the waterfront you have just come into burned.</p>
  <div class="go">Enter to sail again &nbsp;&middot;&nbsp; Esc for the title screen</div>`);
}
let wreck = null;
function fail(t2,d2){
  if (phase==="over" || phase==="wrecking") return;
  const fx=Math.sin(ship.hdg), fy=-Math.cos(ship.hdg);
  wreck = { t:0, title:t2, detail:d2,
    halves:[
      {x:ship.x+fx*7,y:ship.y+fy*7,hdg:ship.hdg,half:"fore",
       vx:ship.vx*.5+fy*.35,vy:ship.vy*.5-fx*.35,om:.22,sink:0},
      {x:ship.x-fx*7,y:ship.y-fy*7,hdg:ship.hdg,half:"aft",
       vx:ship.vx*.5-fy*.3,vy:ship.vy*.5+fx*.3,om:-.3,sink:0},
    ],
    debris: Array.from({length: 18 + Math.floor(ship.cargo*1.4)}, (_,i)=>({
      x:ship.x+(Math.random()-.5)*26, y:ship.y+(Math.random()-.5)*26,
      vx:(Math.random()-.5)*4, vy:(Math.random()-.5)*4,
      a:Math.random()*6.28, om:(Math.random()-.5)*1.4,
      len:3+Math.random()*5, lumber:i>=18 })),
  };
  phase="wrecking";
}
function wreckStep(dt){
  const w=wreck; if(!w) return; w.t+=dt;
  for(const h of w.halves){
    h.x+=(h.vx+env.curX*2)*dt; h.y+=(h.vy+env.curY*2)*dt;
    h.vx*=(1-dt*.55); h.vy*=(1-dt*.55);
    h.hdg+=h.om*dt; h.om*=(1-dt*.5);
    if(w.t>1.6) h.sink=Math.min(1,h.sink+dt*.17);
  }
  for(const d3 of w.debris){
    d3.x+=(d3.vx+env.curX*3)*dt; d3.y+=(d3.vy+env.curY*3)*dt;
    d3.vx*=(1-dt*.8); d3.vy*=(1-dt*.8); d3.a+=d3.om*dt; d3.om*=(1-dt*.6);
  }
  if (w.t>7.2) endWreck();
}
function drawWreck(){
  const w=wreck; if(!w) return;
  ctx.globalAlpha=Math.max(0,.5-w.t*.12); ctx.fillStyle=C.foam;
  ctx.beginPath();
  ctx.ellipse(T.X(w.halves[0].x),T.Y(w.halves[0].y),
              T.S(16+w.t*22),T.S(12+w.t*17),0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  for(const d3 of w.debris){
    ctx.save(); ctx.translate(T.X(d3.x),T.Y(d3.y)); ctx.rotate(d3.a);
    ctx.fillStyle=d3.lumber?C.timber:"#1d2731";
    ctx.fillRect(T.S(-d3.len/2),T.S(-.7),T.S(d3.len),T.S(1.4));
    ctx.restore();
  }
  for(const h of w.halves){
    const L=28,B=8.6;
    ctx.save(); ctx.translate(T.X(h.x),T.Y(h.y)); ctx.rotate(h.hdg);
    ctx.globalAlpha=1-h.sink;
    const sc=1-h.sink*.35, b=B/2*sc, l=L/2*sc;
    ctx.beginPath();
    if(h.half==="fore"){
      ctx.moveTo(0,T.S(-l-2));
      ctx.bezierCurveTo(T.S(b*.85),T.S(-l*.5),T.S(b),T.S(l*.1),T.S(b*.5),T.S(l*.2));
      ctx.lineTo(T.S(-b*.7),T.S(l*.05));
      ctx.bezierCurveTo(T.S(-b),T.S(-l*.2),T.S(-b*.85),T.S(-l*.5),0,T.S(-l-2));
    } else {
      ctx.moveTo(T.S(-b*.6),T.S(-l*.1)); ctx.lineTo(T.S(b*.75),T.S(-l*.25));
      ctx.lineTo(T.S(b*.72),T.S(l)); ctx.lineTo(T.S(-b*.72),T.S(l)); ctx.closePath();
    }
    ctx.fillStyle="#0d131a"; ctx.fill();
    ctx.strokeStyle="rgba(150,168,182,.35)"; ctx.lineWidth=Math.max(1,T.S(.8)); ctx.stroke();
    ctx.strokeStyle="#2a2118"; ctx.lineWidth=Math.max(1,T.S(1));
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.lineTo(T.S(b*2.6*(h.half==="fore"?1:-1)),T.S(l*1.3)); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function endWreck(){
  const t2=wreck.title, d2=wreck.detail; phase="over";
  card(`<h1>${t2}</h1><p>${d2}</p>
  <p class="src">The Gate took plenty. The City of Rio de Janeiro struck Mile Rocks in
  the fog on 22 February 1901 and went down in ten minutes with 128 lost, which is why
  there was a lighthouse on them by 1906.</p>
  <div class="go">Enter to try again &nbsp;&middot;&nbsp; Esc for the title screen</div>`); }

function phases(dt){
  const d = Math.hypot(ship.x-G.BERTH.x, ship.y-G.BERTH.y);
  if (dev){
    if (ship.x > G.LIME_POINT.x + 600 && phase==="gate") phase="bay";
    if (ship.x > G.FORT_MASON.x + 800 && phase==="bay") phase="city";
    if (phase==="city" && d < 700) phase="berth";
    canMoor = phase==="berth" && d < G.BERTH.tol;
    return;
  }
  if (phase==="gate" && ship.x > G.LIME_POINT.x + 600) phase="bay";
  if (phase==="bay" && ship.x > G.FORT_MASON.x + 800) phase="city";
  if (phase==="city" && d < 700) phase="berth";
  canMoor = phase==="berth" && d < G.BERTH.tol && ship.speedKn < 3.4;
  // rock
  // Her hull is 28 yards long and 8 wide. Testing a circle round her middle
  // either let her bow pass through a rock or stopped her a length short of
  // one. The test is now her CENTRELINE against the rock, plus half her beam.
  const hb = 28 * .46, beam = 8.6 * .5;
  const bowX = ship.x + Math.sin(ship.hdg)*hb, bowY = ship.y - Math.cos(ship.hdg)*hb;
  const stnX = ship.x - Math.sin(ship.hdg)*hb, stnY = ship.y + Math.cos(ship.hdg)*hb;
  const toHull = (px, py) => {
    const dx = stnX-bowX, dy = stnY-bowY, L2 = dx*dx+dy*dy || 1;
    let u = ((px-bowX)*dx + (py-bowY)*dy) / L2;
    u = Math.max(0, Math.min(1, u));
    return Math.hypot(px - (bowX+dx*u), py - (bowY+dy*u));
  };
  for (const h of G.HAZARDS.concat(G.SHORE_ROCKS)){
    if (toHull(h.x, h.y) < h.r + beam){
      fail("On the rocks", `You went onto ${h.name} at ${ship.speedKn.toFixed(1)} knots in the fog.`);
      return;
    }
  }
  // and against another vessel it is hull to hull, the same test the AI
  // uses on itself, so a ferry's bow can graze your stern without it
  // counting as running you down
  for (const v of traffic){
    const gap = hullGap({len:28}, v.x, v.y, v.hdg, v.len, ship.x, ship.y, ship.hdg);
    if (gap < (beamOf(v.len) + beam)){
      fail("Run down", `${v.name} came out of the fog and cut you down. She did not see you,
        and in any case she would not have given way.`);
      return;
    }
  }
  if (dev) return;                       // in the workshop nothing kills you
  // the shore. Sail into it and you are ashore, which was the usual end.
  const gr = onLand(ship.x, ship.y) || onLand(bowX, bowY) || onLand(stnX, stnY);
  if (gr){
    fail("Ashore", `You ran her up on ${gr} at ${ship.speedKn.toFixed(1)} knots in the fog.`);
    return;
  }
}

// -------------------------------------------------------------- loop
let last = performance.now();
function frame(now){
  const dt = Math.min((now-last)/1000,.05); last=now;
  try {
  if (phase==="wrecking"){ weatherStep(dt); trafficStep(dt); wreckStep(dt); }
  const live = phase!=="brief" && phase!=="over" && phase!=="wrecking";
  if (live){
    elapsed += dt;
    weatherStep(dt); trafficStep(dt); spotting(dt);
    hornStep(dt); bellStep(dt);
    ship.helm = (keys["arrowleft"]?-1:0)+(keys["arrowright"]?1:0);
    if (keys["arrowup"]) ship.canvas = Math.min(1, ship.canvas+dt*1.3);
    if (keys["arrowdown"]) ship.canvas = Math.max(0, ship.canvas-dt*1.3);
    if (dev){
      // straight kinematics, no sails, no tide: this is not the game, it is
      // the workshop
      if (keys["arrowleft"])  ship.hdg -= dt*2.4;
      if (keys["arrowright"]) ship.hdg += dt*2.4;
      const thrust = keys["arrowup"] ? 46 : keys["arrowdown"] ? -18 : 0;
      ship.vx = Math.sin(ship.hdg)*thrust*KN;
      ship.vy = -Math.cos(ship.hdg)*thrust*KN;
      ship.x += ship.vx*dt*7; ship.y += ship.vy*dt*7;
      ship.speedKn = Math.abs(thrust); ship.throughKn = ship.speedKn;
      ship.canvas = 1; ship.inIrons = false; ship.boomSide = 1; ship.driveNow = .6;
    } else
    for (let i=0;i<10;i++) step(ship, env, dt);   // she steps out on this leg
    if (tow){
      const tx = G.BERTH.x - ship.x, ty = G.BERTH.y - ship.y;
      const d3 = Math.hypot(tx,ty) || 1;
      ship.vx += (tx/d3) * 1.9 * dt;  ship.vy += (ty/d3) * 1.9 * dt;
      ship.vx *= (1 - dt*.5);         ship.vy *= (1 - dt*.5);
      ship.hdg += ((Math.atan2(tx,-ty) - ship.hdg + Math.PI*3) % (Math.PI*2) - Math.PI) * dt * 1.4;
    }
    wakeStep(dt);
    phases(dt);
  }
  } catch (err) {
    window.__simErr = window.__simErr || [];
    if (window.__simErr.length < 12) window.__simErr.push(String(err));
  }
  cam.span += ((SPAN[phase]||1200)-cam.span)*Math.min(1,dt*1.1);
  cam.x += (ship.x+ship.vx*1.5-cam.x)*Math.min(1,dt*3.2);
  cam.y += (ship.y+ship.vy*1.5-cam.y)*Math.min(1,dt*3.2);
  T.k = W/Math.max(60, cam.span);

  // ⚠ ONE BAD DRAW MUST NOT STOP THE LOOP. An uncaught throw inside frame()
  // kills requestAnimationFrame for good, and that is what a freeze looks
  // like. Anything that fails is recorded and the game carries on.
  try {
    ctx.fillStyle="#131e28"; ctx.fillRect(0,0,W,H);
    drawSwell(env.t); drawFlecks(env.t); drawWind(env.t);
    drawShores(); drawIslands(); drawTown(); drawWaterfront();
    drawBatteries(env.t); drawLighthouses(); drawFortPoint(); drawFerryBuilding(); drawWharf(env.t);
    drawShoreRocks(env.t); drawHazards(env.t);
    drawLanterns(); drawTraffic(env.t); drawLights(env.t);
    drawWake();
    if (phase==="wrecking" || (phase==="over" && wreck)) drawWreck();
    else drawVessel(ctx, T, ship, env.t, C);
    drawFog(env.t);
    if (phase!=="brief"){ drawBearings(); drawRose(); drawMinimap(); }
  } catch (err) {
    window.__drawErr = window.__drawErr || [];
    if (window.__drawErr.length < 12) window.__drawErr.push(String(err));
  }
  // ⚠ hud() WAS OUTSIDE THE GUARD, and that is what the freezing was: a
  // throw in the readout stopped the loop being asked for another frame,
  // the whole game stood still, and nothing was recorded because the
  // catch above never saw it. The request is now made no matter what.
  try { hud(); } catch (err) {
    window.__hudErr = window.__hudErr || [];
    if (window.__hudErr.length < 12) window.__hudErr.push(String(err));
  }
  requestAnimationFrame(frame);
}
function pts(deg){ const n=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return n[Math.round(((deg%360)+360)%360/22.5)%16]; }
function hud(){
  el("phase").textContent = {gate:"The Gate", bay:"Inside", city:"The city front",
    berth:"Alongside", over:"", brief:""}[phase]||"";
  el("order").textContent = {
    gate:"Point Bonita is your mark. Mile Rocks has no light on it. The tide through the narrows is the strongest thing here.",
    bay:"Inside now. Keep Alcatraz to port and mind what is at anchor in the stream.",
    city:"The ferries run all day and will not give way to you. Work up to the lumber wharf.",
    berth:"Come alongside slow and make fast. Space.",
    over:""}[phase]||"";
  el("nav").innerHTML = `
    <div>Head <b>${pts(degOf(ship.hdg))} ${degOf(ship.hdg).toFixed(0)}&deg;</b></div>
    <div>Speed <b>${ship.speedKn.toFixed(1)} kn</b></div>
    <div>Wind <b>${pts(env.windFrom)} ${env.windKn.toFixed(0)} kn</b></div>
    <div>Tide <b>${env.flood?"flooding":"ebbing"}</b> ${(env.setKn||0).toFixed(1)} kn</div>
    <div class="a">Fog, and no moon</div>`;
  el("sail").innerHTML = `<div>Canvas <b>${(ship.canvas*100).toFixed(0)}%</b></div>
    ${dev?'<div class="g">DEV &mdash; &#96; to leave it. No wind, no tide, four times her speed.</div>':""}
    <div>${tow?'<span class="a">A tug has you in tow. T to cast her off.</span>'
              :'<span class="k">T &mdash; take a tug (it costs you)</span>'}</div>
    <div>${ship.inIrons?'<span class="r">In irons. Bear away.</span>':
      ship.throughKn<.6?'<span class="a">No way on</span>':'Helm answering'}</div>`;
  el("cargo").innerHTML = `<div>Cargo <b>${Math.floor(ship.cargo)}</b> cords</div>
    ${canMoor?'<div class="g">SPACE &mdash; make fast and discharge</div>':""}`;
}
window.__probe = onLand;
// sound them on demand, to check they are audible
window.__ring = (v) => playClip(bellBuf, v || 1);
window.__horn = (v) => playClip(hornBuf, v || 1);
window.__dev = { get traffic(){return traffic;}, get ship(){return ship;},
  get cam(){return cam;}, get T(){return T;}, get phase(){return phase;}, get env(){return env;},
  put(x,y,h,c){ ship.x=x;ship.y=y;ship.hdg=(h||0)*Math.PI/180;ship.vx=0;ship.vy=0;ship.canvas=c||0; },
  berth(){ this.put(G.BERTH.x, G.BERTH.y, G.BERTH.hdg, 0); } };
requestAnimationFrame(frame);
</script>
