<meta charset="utf-8">
<title>Doghole &mdash; the Golden Gate, 1905</title>
<style>
  :root{ --bg:#070a0f; --amber:#f2a63c; --dim:#8b97a3; --green:#7fd6a2;
    --display: Trattatello, Luminari, "Academy Engraved LET", serif; }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:#dfe6ec;overflow:hidden;
    font-family:var(--display);-webkit-font-smoothing:antialiased}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .plate{position:absolute;inset:0;pointer-events:none;padding:clamp(12px,2vw,26px) clamp(14px,2.4vw,34px)}
  .tl{position:absolute;left:clamp(14px,2.4vw,34px);top:clamp(12px,2vw,26px)}
  .tr{position:absolute;right:clamp(14px,2.4vw,34px);top:clamp(12px,2vw,26px);text-align:right}
  .bl{position:absolute;left:clamp(14px,2.4vw,34px);bottom:clamp(12px,2vw,26px)}
  .br{position:absolute;right:clamp(14px,2.4vw,34px);bottom:clamp(12px,2vw,26px);text-align:right}
  .k{font-size:clamp(10px,.82vw,13px);letter-spacing:.1em;color:var(--dim);line-height:1.85}
  .k b{color:#e7eef4;font-weight:400} .k .a{color:var(--amber)}
  .k .g{color:var(--green)} .k .r{color:#e2705a}
  .phase{font-size:clamp(15px,1.5vw,22px);color:var(--amber);letter-spacing:.06em}
  .order{font-size:clamp(12px,1.05vw,16px);color:#cfd8e0;max-width:32ch;line-height:1.5;
    text-shadow:0 1px 4px rgba(7,10,15,.95)}
  #card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(5,7,11,.86);transition:opacity .5s ease;z-index:5}
  #card.gone{opacity:0;pointer-events:none}
  .cardin{max-width:min(760px,86vw)}
  .cardin h1{font-size:clamp(28px,4.2vw,60px);margin:0 0 .3em;font-weight:400;color:#f2f6f9}
  .cardin p{font-size:clamp(12px,1.12vw,17px);line-height:1.62;color:#c7d1da;margin:.5em 0}
  .cardin .src{font-size:clamp(10px,.86vw,13px);color:var(--dim);line-height:1.7;margin-top:1.1em}
  .cardin .go{margin-top:1.3em;color:var(--amber);font-size:clamp(12px,1.1vw,16px)}
</style>
<canvas id="sea"></canvas>
<div class="plate">
  <div class="tl"><div class="phase" id="phase"></div><div class="order k" id="order"></div></div>
  <div class="tr k" id="nav"></div>
  <div class="bl k" id="sail"></div>
  <div class="br k" id="cargo"></div>
</div>
<div id="card"><div class="cardin" id="cardin"></div></div>
<audio id="theme" src="theme.m4a" loop preload="auto"></audio>

<script type="module">
import * as G from "./gate.js";
import { makeVessel, step, drawVessel, CAPACITY, degOf, norm } from "./vessel.js";
import { KN, rockShape } from "./cove.js";

const cv = document.getElementById("sea"), ctx = cv.getContext("2d", {alpha:false});
let W=0,H=0;
function resize(){ const d=Math.min(devicePixelRatio||1,2);
  W=Math.max(320,innerWidth);H=Math.max(240,innerHeight);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0); }
addEventListener("resize",resize); resize();

const C = { timber:"#c8781f", timberLit:"#f2a63c", foam:"#cfdae2", canvas:"#8d97a2" };
const cam = { x:-4600, y:-500, span:1500 };
const T = { X:x=>(x-cam.x)*T.k+W/2, Y:y=>(y-cam.y)*T.k+H/2, S:v=>v*T.k, k:1 };
// The Gate is 1,830 yards from Fort Point to Lime Point, so the view has to
// be wider than that or you are in the middle of a mile of fog with nothing
// to steer by, which is authentic and unplayable.
const SPAN = { brief:700, gate:640, bay:700, city:560, berth:400, over:520, wrecking:340 };

// -------------------------------------------------- environment, 1905
// Summer fog in the Gate, at night, with no rain in it: the fog comes in on
// the north-west wind and lies on the water. You see lights before you see
// land, which is the whole reason the lights are where they are.
// The course in is about ESE. A wind from within four points of that, on top
// of a foul tide, leaves you unable to move at all, which is not difficulty,
// it is a dead end. So the wind is drawn from anywhere EXCEPT the arc dead
// on the nose, and the tide is capped well below her best speed.
// The bearing you actually need to make, which moves as you get on.
function courseNow(){
  const tgt = (phase === "gate") ? G.LIME_POINT
            : (phase === "bay")  ? G.ALCATRAZ : G.BERTH;
  return (Math.atan2(tgt.x - ship.x, -(tgt.y - ship.y)) * 180/Math.PI + 360) % 360;
}
// A wind is allowed to be anything except dead on the nose of that course.
// She cannot sail within four points, so a wind inside that arc, on top of a
// tide, is not difficulty: it is a dead end. The wind SHIFTS through the
// passage, it just never shifts into the one place that stops you.
// In the bay the wind is FAIR. Not merely legal: fair. It blows broadly the
// way you have to go, so you are reaching or running, not crawling. This leg
// is about seeing, not about sailing, and a foul wind in a fog just makes it
// slow. It still shifts, it still gusts, it is just never against you.
function legalWind(w, course){
  const downwind = (course + 180) % 360;                   // wind from ASTERN
  const off = ((w - downwind + 540) % 360) - 180;
  const MAXOFF = 62;                                       // up to a beam wind
  if (Math.abs(off) <= MAXOFF) return w;
  return (downwind + (off >= 0 ? MAXOFF : -MAXOFF) + 360) % 360;
}
function fairWind(){ return legalWind(Math.random()*360, 110); }
let windShiftIn = 18 + Math.random()*22;
function windStep(dt){
  windShiftIn -= dt;
  if (windShiftIn <= 0){
    windShiftIn = 18 + Math.random()*26;
    env.windWant = (env.windFrom + (Math.random()-.5)*54 + 360) % 360;
    env.gustWant = 9 + Math.random()*11;
  }
  const course = courseNow();
  const want = legalWind(env.windWant ?? env.windFrom, course);
  // and keep the CURRENT wind legal as the course swings round under you
  const now = legalWind(env.windFrom, course);
  let diff = ((want - now + 540) % 360) - 180;
  env.windFrom = (now + diff * Math.min(1, dt*.35) + 360) % 360;
  if (env.gustWant) env.windKn += (env.gustWant - env.windKn) * Math.min(1, dt*.2);
}
const env = {
  t: 0, windFrom: fairWind(), windKn: 12 + Math.random()*8,
  curX: 0, curY: 0, swell: .16, swellDir: 250, swellRate: .5,
  flood: Math.random() < .5,            // the Gate runs one way or the other
  tide: 0, fog: .46,
};
// The tidal stream through the Gate is the strongest thing in this game.
// It runs to six knots at springs in the narrows and falls away in the bay.
function weatherStep(dt){
  env.t += dt; env.tide += dt*.05;
  windStep(dt);     // and it turns, so waiting is a tactic
  const [fx, fy] = [G.FORT_POINT.x, G.FORT_POINT.y];
  const d = Math.hypot(ship.x-fx, ship.y-fy);
  const strength = (1.1 + .9*Math.sin(env.tide)) * Math.exp(-((d/1500)**2));
  const axis = 108 * Math.PI/180;             // the channel runs ESE-WNW
  // The tide is atmosphere here, not the obstacle. The obstacle is that you
  // cannot see. Aodhan's call, 2026-09-22: the San Francisco leg is about
  // limited visibility and dodging what comes out of it.
  const kn = strength * (env.flood ? 1.9 : -1.7);
  env.curX = Math.sin(axis)*kn*KN;
  env.curY = -Math.cos(axis)*kn*KN;
  env.setKn = Math.abs(kn);
}

// One audio context for the lot, created when the game starts, so the horn
// and the bell are not at the mercy of per-element autoplay rules.
let A = null, bellBuf = null, hornBuf = null, muted = false;
async function loadClip(url){
  try { const r = await fetch(url); return await A.decodeAudioData(await r.arrayBuffer()); }
  catch(e){ return null; }
}
function audioInit(){
  if (A) return;
  try { A = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  if (A.state === "suspended") A.resume().catch(()=>{});
  loadClip("bell.m4a").then(b => { bellBuf = b;
    window.__sfxLog.push(b ? "bell loaded" : "BELL FAILED TO LOAD"); });
  loadClip("foghorn.m4a").then(b => { hornBuf = b;
    window.__sfxLog.push(b ? "foghorn loaded" : "FOGHORN FAILED TO LOAD"); });
}
// Nothing sounds in the first moment of a run, and everything that does
// sound is logged, so a stray noise can be named instead of guessed at.
let sfxOpen = 0;
window.__sfxLog = [];
function playClip(buf, vol, tag){
  if (performance.now() < sfxOpen) return;
  window.__sfxLog.push((tag||"clip") + " @" + Math.round(performance.now()/100)/10 + "s");
  if (window.__sfxLog.length > 60) window.__sfxLog.shift();
  if (!A || !buf || muted) return;
  if (A.state === "suspended") A.resume().catch(()=>{});
  const src = A.createBufferSource(); src.buffer = buf;
  const g = A.createGain(); g.gain.value = vol;
  src.connect(g); g.connect(A.destination);
  src.start();
}

// SOUND IN THE FOG. Two things, and both of them sparing.
//
// THE FOG SIGNALS. In 1905 Point Bonita, Lime Point, Fort Point and Alcatraz
// all had them, and in a fog they were the only thing telling you where the
// land was. A blast carries a long way and comes at long intervals, so it
// gets one every minute or so, and quieter the further off you are from the
// station that sounded it.
const FOG_SIGNALS = [G.PT_BONITA, G.LIME_POINT, G.FORT_POINT, G.ALCATRAZ];
let hornIn = 14 + Math.random()*18;
function hornStep(dt){
  hornIn -= dt;
  if (hornIn > 0) return;
  // Aodhan's call: KEEP IT RARE. A real signal sounded every half minute,
  // but on a leg this long that becomes wallpaper and stops meaning anything.
  // Once every minute or two lands better: you notice each one.
  hornIn = 62 + Math.random()*58;
  let d = 1e9;
  for (const f of FOG_SIGNALS) d = Math.min(d, Math.hypot(ship.x-f.x, ship.y-f.y));
  playClip(hornBuf, Math.max(.45, Math.min(1.2, (1 - Math.min(1, d/1600)) * .85 + .45)), "foghorn");
}

// THE BELL BUOYS at the entrance. Rarely, and only within hearing.
let bellIn = 6 + Math.random()*8;
function bellStep(dt){
  bellIn -= dt;
  if (bellIn > 0) return;
  bellIn = 18 + Math.random()*22;
  // the entrance marks, and the buoy on Mile Rocks: a bell buoy on a danger
  // is the one you are listening for
  let d = 1e9;
  for (const b of G.APPROACH_MARKS) d = Math.min(d, Math.hypot(ship.x-b.x, ship.y-b.y));
  for (const h of G.HAZARDS) if (h.name === "MILE ROCKS")
    d = Math.min(d, Math.hypot(ship.x-h.x, ship.y-h.y));
  const REACH = 460;
  if (d > REACH) return;
  playClip(bellBuf, Math.max(.3, Math.min(1.3, (1 - d/REACH) * 1.1 + .3)), "bell");
}

// -------------------------------------------------------------- state
let ship = makeVessel(G.PT_BONITA.x - 260, G.PT_BONITA.y + 240, 80);
ship.cargo = Number(new URLSearchParams(location.search).get("cargo") || 46);
ship.canvas = .6;
let phase = "brief", elapsed = 0, hitBy = null;
// A tug. Sailing vessels were towed through this Gate every day of the week,
// and taking one is the honest answer to a foul wind and a foul tide. It is
// not free: the towage comes off what the cargo made.
let tow = false, tows = 0;
let dev = false;   // backtick: fly her about, ignoring wind and weather
const keys = {};
const el = id => document.getElementById(id);

function card(h){ el("cardin").innerHTML = h; el("card").classList.remove("gone"); }

addEventListener("keydown", e=>{
  const k = e.key.toLowerCase(); keys[k]=true;
  if (k==="enter"){ if(phase==="brief") begin(); else if(phase==="over") location.reload(); }
  if (k===" "){ e.preventDefault(); if (phase==="berth" && canMoor) unload(); }
  if (k==="t" && (phase==="gate"||phase==="bay"||phase==="city"||phase==="berth")){
    tow = !tow; if (tow) tows++;
  }
  // DEV MODE. Backtick: she answers the helm at once, drives wherever you
  // point her whatever the wind is doing, and goes at four times her best
  // speed. For getting to the part you want to look at.
  if (k==="`" || k==="~"){ dev = !dev; }
  if (k==="m"){ muted = !muted; el("theme").muted = muted; }
  if (k==="escape") location.href = "index.html";
});
addEventListener("keyup", e=>{ keys[e.key.toLowerCase()]=false; });

function begin(){ el("card").classList.add("gone"); phase="gate"; audioInit();
  sfxOpen = performance.now() + 2500;
  const a=el("theme"); a.volume=0; a.play().then(()=>{
    const f=setInterval(()=>{a.volume=Math.min(.34,a.volume+.02); if(a.volume>=.42)clearInterval(f);},120);
  }).catch(()=>{}); }

card(`<h1>The run to market</h1>
<p><b>Outside the Gate, a night in 1905.</b> You have your cargo out of Fort Ross
and eighty miles of coast behind you. San Francisco is up the bay, and between
you and it is the Golden Gate in a summer fog.</p>
<p>Point Bonita light is fine on your bow. <b>Mile Rocks has no light on it</b>
and will not have one until next year. The tide runs through the narrows at
four knots and more, and it will take you where it likes if you let it.</p>
<p>Inside, the bay is full of ferries that will not give way to a schooner.
Get up to the Steuart Street lumber wharf and unload.</p>
<p class="src">&larr; &rarr; helm &nbsp;&middot;&nbsp; &uarr;&darr; canvas
&nbsp;&middot;&nbsp; space to make fast when you are alongside<br>
<b>M</b> mutes &nbsp;&middot;&nbsp; <b>Esc</b> back to the title screen<br>
<b>&#96;</b> is a dev mode: no wind, no tide, nothing can hurt you, four times
her speed, for getting straight to the bit you want to look at.<br>
<b>T takes a tug.</b> Sailing vessels were towed through this Gate every day; it is
no disgrace, but the towage comes off what the cargo made. The tide turns as you
go, so waiting for it is also an answer.</p>
<div class="go">Enter to begin</div>`);

// ------------------------------------------------------------ traffic
const traffic = [];
// ⚠ A simplified coastline will always leave some real place on the wrong
// side of the line. Rather than hand-tune the outline forever, every fixed
// work ashore is SETTLED at load: if it comes out in the water, it is walked
// to the nearest land and set a little way in from the edge. The shift is
// tens of yards, so the geography is unchanged, but nothing that belongs on
// land is left standing in the sea. Lighthouses are exempt: they sit at the
// water's edge by definition, which is the whole point of a lighthouse.
function settle(o, inset){
  if (onLand(o.x, o.y)) return o;
  let best = null, bestD = 1e9;
  for (let r = 15; r <= 420; r += 15){
    for (let k = 0; k < 24; k++){
      const th = k * Math.PI / 12;
      const x = o.x + Math.cos(th)*r, y = o.y + Math.sin(th)*r;
      if (!onLand(x, y)) continue;
      if (r < bestD){ bestD = r; best = { x, y, th }; }
    }
    if (best) break;
  }
  if (!best) return o;
  // step a little further in, so it is not sitting on the line
  o.x = best.x + Math.cos(best.th) * inset;
  o.y = best.y + Math.sin(best.th) * inset;
  if (!onLand(o.x, o.y)){ o.x = best.x; o.y = best.y; }
  return o;
}
for (const b of G.BATTERIES) settle(b, 22);
for (const b of G.BUILDINGS) settle(b, 26);
settle(G.FORT_POINT, 10);
settle(G.FORT_MASON, 18);

clipLanes();

// Four of the vessels lying in the stream had been laid down on rock or too
// near the beach. Rather than drop them and lose the traffic, shift each one
// out to the nearest clear water: a master picking a berth would have done
// exactly that.
const ANCHORAGE = G.ANCHORED.map(a => {
  if (!tooNearLand(a.x, a.y, 30)) return { x: a.x, y: a.y };
  for (let r = 25; r <= 400; r += 25){
    for (let k = 0; k < 16; k++){
      const th = k * Math.PI / 8;
      const x = a.x + Math.cos(th)*r, y = a.y + Math.sin(th)*r;
      if (!tooNearLand(x, y, 30)) return { x, y };
    }
  }
  return null;
}).filter(Boolean);
for (const lane of G.LANES){
  if (lane.dead) continue;              // that route has no water in it
  for (let i=0;i<lane.n;i++){
    // spaced evenly down her lane, so none of them starts inside another
    const f = (i + .5) / lane.n;
    traffic.push({ lane, s: lane.s0 + (lane.s1 - lane.s0) * f,
      dir: i % 2 ? -1 : 1,
      sp: lane.speed*(.85+Math.random()*.3), kind: lane.kind, name: lane.name,
      len: lane.len || 60, seen: 0, sx: 0, sy: 0, wait: 0, held: false,
      x: lane.pts[0].x, y: lane.pts[0].y, hdg: 0 });
  }
}
// Lanes were drawn between two points and some of them ran straight over
// the Presidio. Each lane is sampled once at load and clipped to the water,
// so nothing sails across the land any more.
// Not just "is this point ashore" but "is this point CLEAR of the shore".
// A lane that ends on the beach puts a ferry's bow in the sand and she then
// appears to come out of the land, which is what Aodhan saw.
// Land AND rock. A ferry master knew where Mile Rocks was better than you
// did; he was not going to run his boat over it because a lane on a diagram
// happened to pass that way.
// var, deliberately: clipLanes() runs at module level ABOVE this line, and a
// let or const here would still be in its temporal dead zone when it does
var ALL_HAZARDS = null;
function hazards(){
  if (!ALL_HAZARDS) ALL_HAZARDS = G.HAZARDS.concat(G.SHORE_ROCKS);
  return ALL_HAZARDS;
}
function tooNearLand(x, y, clear){
  if (onLand(x, y)) return true;
  for (let a = 0; a < 8; a++){
    const th = a * Math.PI / 4;
    if (onLand(x + Math.cos(th)*clear, y + Math.sin(th)*clear)) return true;
  }
  for (const h of hazards()){
    const d = Math.hypot(x - h.x, y - h.y);
    if (d < h.r + clear * .8) return true;
  }
  return false;
}
// Each lane is a polyline. Measure it once, and clip only the SEAWARD end if
// it runs into anything; the slip end is a pen built for her and is exempt.
function laneGeom(lane){
  lane.seg = []; lane.total = 0;
  for (let i=0;i<lane.pts.length-1;i++){
    const a2=lane.pts[i], b2=lane.pts[i+1];
    const L=Math.hypot(b2.x-a2.x, b2.y-a2.y);
    lane.seg.push({a:a2,b:b2,L,s0:lane.total});
    lane.total += L;
  }
}
function laneAt(lane, s){
  s = Math.max(0, Math.min(lane.total, s));
  for (const g of lane.seg){
    if (s <= g.s0 + g.L || g === lane.seg[lane.seg.length-1]){
      const f = g.L ? (s - g.s0)/g.L : 0;
      const nx = g.L ? (g.b.y-g.a.y)/g.L : 0, ny = g.L ? -(g.b.x-g.a.x)/g.L : 0;
      return { x: g.a.x + (g.b.x-g.a.x)*f, y: g.a.y + (g.b.y-g.a.y)*f,
               hdg: Math.atan2(g.b.x-g.a.x, -(g.b.y-g.a.y)), nx, ny };
    }
  }
  return { x: lane.pts[0].x, y: lane.pts[0].y, hdg: 0 };
}
function clipLanes(){
  for (const lane of G.LANES){
    laneGeom(lane);
    const clear = Math.max(26, (lane.len || 60) * .55);
    const skip = lane.slip !== undefined ? 90 : 0;   // her own slip and its mouth
    // ⚠ ORDER MATTERS. Find where the water STARTS first, then run on from
    // there to where it ends. Scanning for the end first broke four lanes:
    // their first waypoint was inside the clearance, so the scan stopped at
    // zero and the run came out empty.
    lane.s0 = skip;
    while (lane.s0 < lane.total){
      const p2 = laneAt(lane, lane.s0);
      if (!tooNearLand(p2.x, p2.y, clear)) break;
      if (lane.slip !== undefined) break;         // her own pen is not a hazard
      lane.s0 += 6;
    }
    lane.s1 = lane.total;
    for (let s = lane.s0 + 6; s <= lane.total; s += 6){
      const p2 = laneAt(lane, s);
      if (tooNearLand(p2.x, p2.y, clear)){ lane.s1 = s - 6; break; }
    }
    while (lane.s1 > lane.s0){
      const p2 = laneAt(lane, lane.s1);
      if (!tooNearLand(p2.x, p2.y, clear)) break;
      lane.s1 -= 6;
    }
    lane.dead = lane.s1 - lane.s0 < 80;
  }
}

// You know where a vessel is only if you have SEEN her: inside your own
// circle, or lit up in the pool of a lighthouse. After that the chart holds
// her last known position, and that goes stale.
function spotting(dt){
  const near = 300 / Math.max(.15, 1);
  for (const v of traffic){
    const d3 = Math.hypot(v.x - ship.x, v.y - ship.y);
    let lit = false;
    if (d3 < 760){
      for (const L of G.LIGHTS){
        if (Math.hypot(v.x - L.x, v.y - L.y) < L.range * G.COMPRESS * .62){ lit = true; break; }
      }
    }
    if (d3 < near || lit){ v.seen = 1; v.sx = v.x; v.sy = v.y; }
    else v.seen = Math.max(0, v.seen - dt * .05);        // the contact goes stale
  }
}
// NOTHING OVERLAPS ANYTHING. Every vessel looks at every other, and if she
// would close inside their two half-lengths she stops until it is clear. The
// lower-numbered vessel has the right of way, so two of them cannot both
// stand still waiting for the other.
// NOTHING OVERLAPS ANYTHING, and it is done in two passes so that no vessel
// can move into the space another is about to leave or occupy.
//
// Two rules do the work:
//  1. KEEP TO YOUR OWN SIDE. A vessel outbound on a lane rides a little to
//     one side of it and an inbound vessel to the other, so they pass port
//     to port the way they are supposed to and never meet head on.
//  2. GIVE WAY. Before she moves, each vessel tests her INTENDED position
//     against everybody else's intended position. If she would close inside
//     their two half-lengths she stops; the tie goes to the lower number, so
//     they cannot both stand there waiting for the other.
// distance between two line segments, so two vessels passing side by side
// are judged on how far apart their HULLS are and not on their lengths
function segSeg(ax,ay,bx,by, cx,cy,dx,dy){
  const d1x=bx-ax, d1y=by-ay, d2x=dx-cx, d2y=dy-cy;
  const r1=ax-cx, r2=ay-cy;
  const a=d1x*d1x+d1y*d1y, e=d2x*d2x+d2y*d2y, f=d2x*r1+d2y*r2;
  let s1=0, t1=0;
  const c=d1x*r1+d1y*r2, b=d1x*d2x+d1y*d2y;
  const den=a*e-b*b;
  if (den > 1e-9) s1 = Math.max(0, Math.min(1, (b*f-c*e)/den));
  t1 = (b*s1+f)/(e||1);
  t1 = Math.max(0, Math.min(1, t1));
  s1 = Math.max(0, Math.min(1, (b*t1-c)/(a||1)));
  const px=ax+d1x*s1-(cx+d2x*t1), py=ay+d1y*s1-(cy+d2y*t1);
  return Math.hypot(px,py);
}
function hullGap(v, ox, oy, ohdg, olen, vx, vy, vhdg){
  const h1=vlen2(v.len), h2=vlen2(olen);
  const a1x=vx+Math.sin(vhdg)*h1, a1y=vy-Math.cos(vhdg)*h1;
  const a2x=vx-Math.sin(vhdg)*h1, a2y=vy+Math.cos(vhdg)*h1;
  const b1x=ox+Math.sin(ohdg)*h2, b1y=oy-Math.cos(ohdg)*h2;
  const b2x=ox-Math.sin(ohdg)*h2, b2y=oy+Math.cos(ohdg)*h2;
  return segSeg(a1x,a1y,a2x,a2y, b1x,b1y,b2x,b2y);
}
const vlen2 = L => L*.42;                    // half her length, less the ends
function beamOf(L){ return L*.24; }

function placeOn(lane, s, dir, len){
  const p = laneAt(lane, s);
  const off = (dir > 0 ? 1 : -1) * (12 + len * .20);
  return { x: p.x + p.nx*off, y: p.y + p.ny*off,
           hdg: p.hdg + (dir < 0 ? Math.PI : 0) };
}
function trafficStep(dt){
  // pass one: where would each of them like to be?
  for (const v of traffic){
    if (v.wait > 0){ v.wait -= dt; v.ns = v.s; continue; }
    v.ns = v.s + v.dir * (v.sp * KN * 7) * dt;
    if (v.ns > v.lane.s1 || v.ns < v.lane.s0) v.ns = v.s;   // resolved below
    const p = placeOn(v.lane, v.ns, v.dir, v.len);
    v.px = p.x; v.py = p.y;
  }
  // pass two: who has to stand on?
  for (let i=0;i<traffic.length;i++){
    const v = traffic[i];
    if (v.wait > 0){ v.held = true; continue; }
    let hold = false;
    for (let j=0;j<traffic.length && !hold;j++){
      if (j === i) continue;
      const o = traffic[j];
      const room = (beamOf(v.len) + beamOf(o.len)) * .5 + 26;
      const then = hullGap(v, o.px, o.py, o.hdg, o.len, v.px, v.py, v.hdg);
      if (then > room) continue;
      const now = hullGap(v, o.x, o.y, o.hdg, o.len, v.x, v.y, v.hdg);
      if (then < now || j < i) hold = true;
    }
    v.held = hold;
    if (hold) continue;
    v.s = v.s + v.dir * (v.sp * KN * 7) * dt;
    if (v.s > v.lane.s1){ v.s = v.lane.s1; v.dir = -1; v.wait = 2 + Math.random()*3; }
    if (v.s < v.lane.s0){ v.s = v.lane.s0; v.dir = 1;
      if (v.lane.slip !== undefined) v.wait = 4 + Math.random()*5; }
  }
  // and put them where they ended up
  for (const v of traffic){
    const p = placeOn(v.lane, v.s, v.dir, v.len);
    v.x = p.x; v.y = p.y; v.hdg = p.hdg;
  }
  // A last guarantee. If two hulls are still inside each other after all
  // that, back the higher-numbered one down her own lane until she is clear.
  // Prediction can be beaten by a long frame; this cannot.
  for (let pass=0; pass<5; pass++){
    let fixed = false;
    for (let i=0;i<traffic.length;i++){
      const v = traffic[i];
      for (let j=0;j<i;j++){
        const o = traffic[j];
        const room = (beamOf(v.len) + beamOf(o.len)) * .5 + 22;
        if (hullGap(v, o.x, o.y, o.hdg, o.len, v.x, v.y, v.hdg) >= room) continue;
        for (let back=0; back<14; back++){
          v.s -= v.dir * 6;
          if (v.s < v.lane.s0) v.s = v.lane.s0;
          if (v.s > v.lane.s1) v.s = v.lane.s1;
          const p = placeOn(v.lane, v.s, v.dir, v.len);
          v.x = p.x; v.y = p.y; v.hdg = p.hdg;
          if (hullGap(v, o.x, o.y, o.hdg, o.len, v.x, v.y, v.hdg) >= room) break;
        }
        v.held = true; fixed = true;
      }
    }
    if (!fixed) break;
  }
}

function inPoly(x, y, pts, closeTo){
  const all = pts.concat(closeTo);
  let inside = false;
  for (let i = 0, j = all.length - 1; i < all.length; j = i++){
    const xi = all[i][0], yi = all[i][1], xj = all[j][0], yj = all[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function onLand(x, y){
  if (inPoly(x, y, G.MARIN, [[-9000,-14000],[14000,-14000]])) return "the Marin shore";
  if (inPoly(x, y, G.CITY,  [[14000,14000],[-9000,14000]]))   return "the city shore";
  for (const is of G.ISLANDS){
    let inside = false;
    const P = is.poly;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++){
      if ((P[i][1] > y) !== (P[j][1] > y) &&
          x < (P[j][0]-P[i][0]) * (y-P[i][1]) / (P[j][1]-P[i][1]) + P[i][0]) inside = !inside;
    }
    if (inside) return is.name;
  }
  return null;
}

function rnd2(i){ let s2=(i*1103515245+12345)>>>0; s2=(s2^(s2>>>15))>>>0; return (s2%100000)/100000; }
function drawSwell(t){
  const a=(env.swellDir+90)*Math.PI/180, ux=Math.cos(a), uy=Math.sin(a);
  const px=-uy, py=ux, gap=60, len=Math.max(W,H)*1.6/T.k;
  const phase2=(t*22)%gap;
  ctx.save(); ctx.strokeStyle="rgba(180,202,220,.06)";
  ctx.lineWidth=Math.max(1,T.S(2.4));
  const n=Math.ceil(Math.max(W,H)/T.k/gap)+3;
  const base=Math.round((cam.x*px+cam.y*py)/gap)*gap;
  for(let i=-n;i<n;i++){
    const d2=base+i*gap+phase2, bx=px*d2, by=py*d2;
    ctx.beginPath();
    ctx.moveTo(T.X(bx-ux*len),T.Y(by-uy*len));
    ctx.lineTo(T.X(bx+ux*len),T.Y(by+uy*len));
    ctx.stroke();
  }
  ctx.restore();
}
function drawFlecks(t){
  const cell=30, hw=W/2/T.k, hh=H/2/T.k;
  const i0=Math.floor((cam.x-hw)/cell), i1=Math.ceil((cam.x+hw)/cell);
  const j0=Math.floor((cam.y-hh)/cell), j1=Math.ceil((cam.y+hh)/cell);
  if ((i1-i0)*(j1-j0)>4000) return;
  ctx.fillStyle="#b9d2e4";
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const h=(((i*73856093)^(j*19349663))>>>0);
    const fx=i*cell+(h%997)/997*cell, fy=j*cell+((h>>10)%991)/991*cell;
    ctx.globalAlpha=.04+.13*Math.max(0,Math.sin(t*1.1+(h%628)/100));
    ctx.fillRect(T.X(fx),T.Y(fy),Math.max(1.2,T.S(3)),Math.max(1,T.S(1)));
  }
  ctx.globalAlpha=1;
}
const wake=[]; let wakeT=0;
function wakeStep(dt){
  wakeT-=dt;
  if (wakeT<=0 && ship.speedKn>.7){ wakeT=.09;
    wake.push({x:ship.x+(Math.random()-.5)*5,y:ship.y+(Math.random()-.5)*5,
               a:Math.min(1,ship.speedKn/5),r:1.2+Math.random()*2}); 
    if (wake.length>110) wake.shift(); }
  for(const w of wake){ w.a-=dt*.42; w.x+=env.curX*dt; w.y+=env.curY*dt; }
  while(wake.length && wake[0].a<=0) wake.shift();
}
function drawWake(){
  for(const w of wake){
    const age=1-Math.max(0,w.a), r=w.r*(1+age*2.4);
    ctx.globalAlpha=Math.max(0,w.a)*.2; ctx.fillStyle="#0c161d";
    ctx.beginPath(); ctx.ellipse(T.X(w.x),T.Y(w.y),T.S(r),T.S(r*.72),0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=Math.max(0,w.a)*.14*(1-age); ctx.strokeStyle="#cfe6f4";
    ctx.lineWidth=Math.max(1,T.S(.5));
    ctx.beginPath(); ctx.ellipse(T.X(w.x),T.Y(w.y),T.S(r*.8),T.S(r*.55),0,0,Math.PI*2); ctx.stroke();
  }

}

trafficStep(0);

function landPoly(pts, closeTo){
  ctx.beginPath();
  ctx.moveTo(T.X(pts[0][0]), T.Y(pts[0][1]));
  for (const [x,y] of pts) ctx.lineTo(T.X(x), T.Y(y));
  for (const [x,y] of closeTo) ctx.lineTo(T.X(x), T.Y(y));
  ctx.closePath();
}
function hills(clipPts, closeTo, seed){
  ctx.save(); landPoly(clipPts, closeTo); ctx.clip();
  for (let i=0;i<300;i++){
    const r0=rnd2(i*3+seed), r1=rnd2(i*3+1+seed), r2=rnd2(i*3+2+seed);
    const x = -7000 + r0*17000, y = -9000 + r1*11000;
    const R = 180 + r2*520;
    if (!onScreen(x, y, T.S(R) + 40)) continue;
    ctx.fillStyle = r2>.5 ? "rgba(44,56,44,.5)" : "rgba(26,36,30,.5)";
    ctx.beginPath(); ctx.ellipse(T.X(x),T.Y(y),T.S(R),T.S(R*.72),0,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

  ctx.save();

  for (let i=0;i<520;i++){
    const r = (i*9301+49297)%233280/233280, r2=((i*7919)%10007)/10007;
    const x = G.FORT_MASON.x + r*5200, y = G.FORT_MASON.y + 200 + r2*2600;

function drawIslands(){

// Guns. The count and the type come off the battery's own record, so a
// four-gun six-inch barbette has four barrels and a mortar battery has pits,
// not barrels: mortars fire nearly straight up and sit down in the ground.
function gunSpec(g){
  const m = /(\d+)\s*x\s*([\d.]+)-in/.exec(g || "");
  const n = m ? Math.min(8, parseInt(m[1],10)) : 2;
  const cal = m ? parseFloat(m[2]) : 6;
  const mortar = /mortar/i.test(g||"");
  const disappearing = /disappearing/i.test(g||"");
  return { n, cal, mortar, disappearing };
}
function drawBatteries(t){
  for (const b of G.BATTERIES){
    const x=T.X(b.x), y=T.Y(b.y);
    if (x<-90||x>W+90||y<-90||y>H+90) continue;
    const g = gunSpec(b.guns);
    const w = 8 + g.n*5.5, h = 13;
    ctx.save(); ctx.translate(x,y);
    // Which way she faces. Not a guess: sweep the compass and take the
    // bearing on which the water starts soonest. A battery whose parapet
    // faces inland is a nonsense, and Fort Mason's was doing exactly that.
    if (b.face === undefined){
      let best = 1e9, bestA = 0;
      for (let k = 0; k < 48; k++){
        const th = k * Math.PI / 24;
        for (let r = 20; r <= 600; r += 20){
          if (!onLand(b.x + Math.cos(th)*r, b.y + Math.sin(th)*r)){
            if (r < best){ best = r; bestA = th; }
            break;
          }
        }
      }
      b.face = bestA;
    }
    ctx.rotate(b.face - Math.PI/2);          // the parapet lies across it
    // the parapet. An earthwork is a bank of earth with a palisade along it;
    // an Endicott battery is a slab of concrete. They should not look alike.
    ctx.fillStyle="rgba(5,8,12,.55)";
    ctx.fillRect(T.S(-w/2)+T.S(1.4), T.S(-h/2)+T.S(1.6), T.S(w), T.S(h));
    if (b.earthwork){
      ctx.fillStyle="#4a4e38";
      ctx.beginPath();
      ctx.moveTo(T.S(-w/2), T.S(h/2));
      ctx.quadraticCurveTo(0, T.S(-h/2-2), T.S(w/2), T.S(h/2));
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle="rgba(190,200,170,.45)"; ctx.lineWidth=Math.max(1,T.S(.5));
      ctx.stroke();
      // the palisade along the top of the bank
      ctx.strokeStyle="#6b5a3c"; ctx.lineWidth=Math.max(1,T.S(.7));
      for (let i=0;i<=Math.round(w/2.2);i++){
        const px = -w/2 + i*2.2;
        const py = -h/2 + 1.2 + (px*px)/(w*w/4)*h*.7;
        ctx.beginPath();
        ctx.moveTo(T.S(px), T.S(py)); ctx.lineTo(T.S(px), T.S(py+2.6));
        ctx.stroke();
      }
    } else {
      ctx.fillStyle="#57616a";
      ctx.fillRect(T.S(-w/2), T.S(-h/2), T.S(w), T.S(h));
      ctx.fillStyle="#3d464e";
      ctx.fillRect(T.S(-w/2), T.S(-h/2), T.S(w), T.S(h*.42));
      ctx.strokeStyle="rgba(200,214,226,.5)"; ctx.lineWidth=Math.max(1,T.S(.5));
      ctx.strokeRect(T.S(-w/2), T.S(-h/2), T.S(w), T.S(h));
    }
    // the emplacements
    for (let i=0;i<g.n;i++){
      const gx = -w/2 + (i+.5)*(w/g.n);
      if (g.mortar){                                  // a pit, four to a pit
        ctx.fillStyle="#22292f";
        ctx.beginPath(); ctx.arc(T.S(gx), 0, Math.max(1.2,T.S(2.4)), 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle="#6d7780"; ctx.lineWidth=Math.max(1,T.S(.5));
        ctx.beginPath(); ctx.arc(T.S(gx), 0, Math.max(1.2,T.S(2.4)), 0, Math.PI*2); ctx.stroke();
      } else {
        ctx.fillStyle="#2b333a";                      // the pit
        ctx.beginPath(); ctx.arc(T.S(gx), T.S(1.4), Math.max(1.2,T.S(2.2)), 0, Math.PI*2); ctx.fill();
        // the piece itself, run out over the parapet
        const len = 3.4 + g.cal*.34;
        ctx.strokeStyle="#1b2127";
        ctx.lineWidth=Math.max(1.4, T.S(.5 + g.cal*.055));
        ctx.beginPath();
        ctx.moveTo(T.S(gx), T.S(1.4));
        ctx.lineTo(T.S(gx), T.S(1.4 - len));
        ctx.stroke();
        if (g.disappearing){                          // its counterweight pit
          ctx.strokeStyle="rgba(150,166,180,.45)"; ctx.lineWidth=Math.max(1,T.S(.4));

        }

      ctx.textAlign="center";

      ctx.globalAlpha=.4;
      ctx.fillText(b.guns, x, y - T.S(4));
      ctx.globalAlpha=1;
    }
  }
}
